<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadMind — Autonomous Performance Engineering & Stress Testing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #08090d;
            --bg-sidebar: #0b0c11;
            --bg-header: #0b0c11;
            --bg-card: #10121a;
            --bg-card-subtle: #141620;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.12);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: #cbd5e1;
            -webkit-font-smoothing: antialiased;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .matte-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
        }
        .matte-card-subtle {
            background-color: var(--bg-card-subtle);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen selection:bg-indigo-500/30 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCENARIOS = [
            {
                id: "blocking_async",
                name: "E-Commerce Checkout Stress",
                endpoint: "/checkout/process",
                target: "http://localhost:8002/checkout/process",
                method: "GET",
                persona: "e_commerce_shopper",
                load_profile: "Step Ramp",
                concurrency: 12,
                duration: 10,
                failure_mode: "blocking_async",
                description: "Synchronous time.sleep(1.0) blocks FastAPI single-threaded event loop, triggering latency spikes under concurrent load."
            },
            {
                id: "n_plus_one",
                name: "Database Heavy /products",
                endpoint: "/products",
                target: "http://localhost:8002/products",
                method: "GET",
                persona: "heavy_read",
                load_profile: "Step Ramp",
                concurrency: 15,
                duration: 12,
                failure_mode: "n_plus_one",
                description: "N+1 query amplification: executes a separate SQL query per product vendor inside a loop."
            },
            {
                id: "db_pool",
                name: "Connection Pool /db-status",
                endpoint: "/db-status",
                target: "http://localhost:8002/db-status",
                method: "GET",
                persona: "standard",
                load_profile: "Step Ramp",
                concurrency: 15,
                duration: 12,
                failure_mode: "db_pool",
                description: "Holds database connection with pg_sleep(2.0), quickly exhausting PostgreSQL connection pool limit."
            },
            {
                id: "public_gateway",
                name: "Third-Party Payment Gateway",
                endpoint: "/payments/process",
                target: "http://localhost:8002/payments/process",
                method: "GET",
                persona: "external_service",
                load_profile: "Step Ramp",
                concurrency: 12,
                duration: 10,
                failure_mode: "high_network_latency",
                description: "Calls live public httpbin.org server with network latency. Patch shields client with async circuit breaker."
            }
        ];

        function App() {
            const [selectedScenario, setSelectedScenario] = useState(SCENARIOS[0]);
            const [showScenariosList, setShowScenariosList] = useState(false);
            const [targetUrl, setTargetUrl] = useState("http://localhost:8002/checkout/process");
            const [concurrencyInput, setConcurrencyInput] = useState(12);
            const [durationInput, setDurationInput] = useState(10);
            
            // Workflow States: IDLE, RUNNING, BREAKING_POINT_DETECTED, ANALYZING, DIAGNOSIS_READY, PATCH_READY, PATCH_APPLIED, COMPLETED, FAILED
            const [runState, setRunState] = useState("IDLE");
            const [testTimer, setTestTimer] = useState("00:00");
            const [activeNav, setActiveNav] = useState("dashboard");
            const [grafanaRefreshKey, setGrafanaRefreshKey] = useState(Date.now());

            // Real Data Telemetry State
            const [currentTest, setCurrentTest] = useState(null);
            const [metrics, setMetrics] = useState([]);
            const [diagnosis, setDiagnosis] = useState(null);
            const [remediation, setRemediation] = useState(null);
            const [verification, setVerification] = useState(null);
            const [memoryStats, setMemoryStats] = useState(null);
            const [incidentsList, setIncidentsList] = useState([]);
            const [similarIncidents, setSimilarIncidents] = useState([]);
            
            // Real Timeline Events Log
            const [timeline, setTimeline] = useState([]);
            const [patchApplying, setPatchApplying] = useState(false);
            const [patchStatusMsg, setPatchStatusMsg] = useState("");
            const [isVerifying, setIsVerifying] = useState(false);

            const pollIntervalRef = useRef(null);
            const timerRef = useRef(null);

            const addTimelineEvent = (msg, tag = "INFO") => {
                const now = new Date();
                const timeStr = now.toTimeString().split(" ")[0];
                setTimeline(prev => [...prev, { time: timeStr, text: msg, tag }]);
            };

            useEffect(() => {
                loadInitialSystemData();
                return () => {
                    if (pollIntervalRef.current) clearInterval(pollIntervalRef.current);
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, []);

            const loadInitialSystemData = async () => {
                try {
                    const [learnRes, incRes] = await Promise.all([
                        fetch("http://localhost:8001/api/learning"),
                        fetch("http://localhost:8001/api/incidents")
                    ]);
                    if (learnRes.ok) setMemoryStats(await learnRes.json());
                    if (incRes.ok) {
                        const list = await incRes.json();
                        setIncidentsList(list);
                    }
                } catch (e) {
                    console.error("Backend health check failed:", e);
                }
            };

            const selectScenario = (s) => {
                setSelectedScenario(s);
                setTargetUrl(s.target);
                setConcurrencyInput(s.concurrency);
                setDurationInput(s.duration);
                setCurrentTest(null);
                setMetrics([]);
                setDiagnosis(null);
                setRemediation(null);
                setVerification(null);
                setRunState("IDLE");
            };

            const startStressTest = async (failureModeOverride = null, maxUsersOverride = null) => {
                setRunState("RUNNING");
                setMetrics([]);
                setDiagnosis(null);
                setRemediation(null);
                setVerification(null);
                setSimilarIncidents([]);
                setTimeline([]);
                setPatchStatusMsg("");

                const activeMode = (typeof failureModeOverride === 'string') ? failureModeOverride : selectedScenario.failure_mode;
                const activeConcurrency = (typeof maxUsersOverride === 'number') ? maxUsersOverride : (Number(concurrencyInput) || selectedScenario.concurrency);

                addTimelineEvent(`Initiating ${selectedScenario.name}`, "START");
                addTimelineEvent(`Target: ${targetUrl} (Mode: ${activeMode})`, "CONFIG");

                let elapsed = 0;
                if (timerRef.current) clearInterval(timerRef.current);
                timerRef.current = setInterval(() => {
                    elapsed++;
                    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const s = String(elapsed % 60).padStart(2, '0');
                    setTestTimer(`${m}:${s}`);
                }, 1000);

                try {
                    const payload = {
                        name: activeMode === "none" ? `${selectedScenario.name} (Remediated Baseline)` : selectedScenario.name,
                        target_app_url: targetUrl.startsWith("http") ? targetUrl : `http://${targetUrl}`,
                        http_method: selectedScenario.method,
                        user_persona: selectedScenario.persona,
                        load_profile: "step_ramp",
                        max_concurrency: activeConcurrency,
                        duration_seconds: Number(durationInput) || selectedScenario.duration,
                        failure_mode: activeMode
                    };

                    const res = await fetch("http://localhost:8001/api/tests/start", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        setRunState("FAILED");
                        addTimelineEvent("Failed to launch load test runner on backend", "ERROR");
                        clearInterval(timerRef.current);
                        return;
                    }

                    const testObj = await res.json();
                    setCurrentTest(testObj);
                    setRunState("RUNNING");
                    addTimelineEvent(`Test Run #${testObj.id} started with step ramp load`, "EXEC");
                    pollActiveTelemetry(testObj.id);

                } catch (err) {
                    console.error("Start test fetch error:", err);
                    setRunState("FAILED");
                    addTimelineEvent(`Connection error: ${err.message}`, "ERROR");
                    clearInterval(timerRef.current);
                }
            };

            const pollActiveTelemetry = (testId) => {
                if (pollIntervalRef.current) clearInterval(pollIntervalRef.current);
                
                let detectedBpLogged = false;

                pollIntervalRef.current = setInterval(async () => {
                    try {
                        const [tRes, mRes] = await Promise.all([
                            fetch(`http://localhost:8001/api/tests/${testId}`),
                            fetch(`http://localhost:8001/api/tests/${testId}/metrics`)
                        ]);

                        if (mRes.ok) {
                            const stream = await mRes.json();
                            setMetrics(stream);

                            if (stream.length > 0) {
                                const latest = stream[stream.length - 1];
                                if ((latest.p95_ms > 1000.0 || latest.error_rate > 0.05) && !detectedBpLogged) {
                                    detectedBpLogged = true;
                                    setRunState("BREAKING_POINT_DETECTED");
                                    addTimelineEvent(`Breaking threshold exceeded: P95=${latest.p95_ms}ms, Error=${(latest.error_rate*100).toFixed(1)}% at ${latest.users} users`, "ALERT");
                                }
                            }
                        }

                        if (tRes.ok) {
                            const t = await tRes.json();
                            setCurrentTest(t);

                            if (t.status === "completed") {
                                clearInterval(pollIntervalRef.current);
                                clearInterval(timerRef.current);
                                addTimelineEvent(`Load execution completed. Peak users: ${t.breaking_point_users || concurrencyInput}`, "COMPLETE");
                                fetchAIDiagnosisAndRemediation(testId);
                                loadInitialSystemData();
                            }
                        }
                    } catch (e) {
                        console.error("Telemetry polling error:", e);
                    }
                }, 1000);
            };

            const fetchAIDiagnosisAndRemediation = async (testId) => {
                setRunState("ANALYZING");
                addTimelineEvent("Querying vector memory & Groq Diagnostician Agent...", "AI");

                try {
                    const [diagRes, remRes] = await Promise.all([
                        fetch(`http://localhost:8001/api/tests/${testId}/diagnosis`),
                        fetch(`http://localhost:8001/api/tests/${testId}/remediation`)
                    ]);

                    if (diagRes.ok) {
                        const d = await diagRes.json();
                        setDiagnosis(d);
                        setRunState("DIAGNOSIS_READY");
                        addTimelineEvent(`AI Diagnosis: ${d.primary_root_cause} (Confidence: ${Math.round(d.confidence*100)}%)`, "DIAG");
                    }

                    if (remRes.ok) {
                        const r = await remRes.json();
                        setRemediation(r);
                        setRunState(r.is_applied ? "PATCH_APPLIED" : "PATCH_READY");
                        addTimelineEvent(r.is_applied ? "Target remediation patch applied & verified" : "Target remediation patch prescription generated", "REMED");
                    } else {
                        setRunState("DIAGNOSIS_READY");
                    }

                    const memRes = await fetch("http://localhost:8001/api/learning");
                    if (memRes.ok) {
                        const memData = await memRes.json();
                        setMemoryStats(memData);
                        if (memData.patterns && diagnosis) {
                            setSimilarIncidents(memData.patterns.filter(p => p.root_cause === diagnosis?.primary_root_cause));
                        }
                    }
                } catch (e) {
                    console.error("AI diagnosis extraction error:", e);
                    setRunState("DIAGNOSIS_READY");
                    addTimelineEvent("AI diagnosis extraction error", "ERROR");
                }
            };

            const applyRemediationPatch = async () => {
                if (!currentTest) return;
                setPatchApplying(true);
                setPatchStatusMsg("Applying code diff to target-app container...");
                addTimelineEvent("Applying code patch diff to target container...", "PATCH");

                try {
                    await new Promise(r => setTimeout(r, 600));
                    setPatchStatusMsg("Restarting target-app container via Docker...");
                    addTimelineEvent("Restarting target-app container via Docker API...", "DOCKER");

                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/remediate`, { method: "POST" });
                    
                    if (res.ok) {
                        const data = await res.json();
                        setRemediation(data.remediation || data);
                        setPatchStatusMsg("Target container health check: 200 OK ✓");
                        addTimelineEvent("Target restarted and verified healthy", "SUCCESS");
                        setRunState("PATCH_APPLIED");
                    } else {
                        setPatchStatusMsg("Failed to apply patch");
                        addTimelineEvent("Patch application error", "ERROR");
                    }
                } catch (e) {
                    setPatchStatusMsg(`Error: ${e.message}`);
                    addTimelineEvent(`Remediation error: ${e.message}`, "ERROR");
                } finally {
                    setPatchApplying(false);
                }
            };

            const runPostFixVerification = async () => {
                if (!currentTest) return;
                setIsVerifying(true);
                addTimelineEvent("Running post-fix verification load at breaking concurrency...", "VERIFY");

                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/verify`, { method: "POST" });
                    if (res.ok) {
                        const vData = await res.json();
                        setVerification(vData);
                        setRunState("COMPLETED");
                        addTimelineEvent(vData.summary, vData.success ? "VERIFIED" : "WARN");
                        loadInitialSystemData();
                    } else {
                        addTimelineEvent("Post-fix verification run failed on backend", "ERROR");
                    }
                } catch (e) {
                    addTimelineEvent(`Verification failed: ${e.message}`, "ERROR");
                } finally {
                    setIsVerifying(false);
                }
            };

            const resetToNewRun = () => {
                setCurrentTest(null);
                setMetrics([]);
                setDiagnosis(null);
                setRemediation(null);
                setVerification(null);
                setSimilarIncidents([]);
                setTimeline([]);
                setPatchStatusMsg("");
                setRunState("IDLE");
                setTestTimer("00:00");
            };

            const latestMetric = metrics.length > 0 ? metrics[metrics.length - 1] : null;
            const statusCodeCounts = latestMetric?.status_codes || {};
            const totalStatusReqs = Object.values(statusCodeCounts).reduce((a, b) => a + b, 0) || 1;

            // Determine Dynamic CTA Button State
            const hasBreakingPoint = Boolean(currentTest?.breaking_point_users || (latestMetric && (latestMetric.p95_ms > 1000 || latestMetric.error_rate > 0.05)));
            const isExternalTarget = Boolean(targetUrl && !targetUrl.includes("localhost:8002") && !targetUrl.includes("target-app"));

            let ctaMode = "RUN";
            if (runState === "RUNNING") {
                ctaMode = "RUNNING";
            } else if (runState === "ANALYZING") {
                ctaMode = "ANALYZING";
            } else if (verification) {
                ctaMode = "COMPLETED";
            } else if (remediation?.is_applied || runState === "PATCH_APPLIED") {
                ctaMode = "VERIFY";
            } else if (hasBreakingPoint || remediation || runState === "BREAKING_POINT_DETECTED" || runState === "DIAGNOSIS_READY" || runState === "PATCH_READY") {
                ctaMode = "APPLY_PATCH";
            }

            return (
                <div className="flex min-h-screen w-full bg-[#08090d] text-slate-300">
                    
                    {/* LEFT SIDEBAR NAVIGATION */}
                    <aside className="w-56 shrink-0 border-r border-white/[0.05] flex flex-col justify-between p-4 bg-[#0b0c11] fixed top-0 bottom-0 left-0 z-30">
                        <div className="space-y-6">
                            {/* Brand Header */}
                            <div className="flex items-center space-x-2.5 px-2 pt-1">
                                <div className="w-7 h-7 rounded bg-slate-800 border border-white/10 flex items-center justify-center font-bold text-white text-xs">
                                    LM
                                </div>
                                <div>
                                    <div className="text-sm font-semibold tracking-tight text-white leading-none">LoadMind</div>
                                    <div className="text-[9px] text-slate-500 font-mono tracking-wider uppercase mt-1">Autonomous DevOps</div>
                                </div>
                            </div>

                            {/* Navigation */}
                            <nav className="space-y-1">
                                <button
                                    onClick={() => setActiveNav("dashboard")}
                                    className={`w-full flex items-center space-x-2.5 px-3 py-2 rounded text-xs font-medium transition ${
                                        activeNav === 'dashboard' ? 'bg-white/[0.08] text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-white/[0.02]'
                                    }`}
                                >
                                    <span>⚡</span>
                                    <span>Stress Testing</span>
                                </button>

                                <button
                                    onClick={() => setActiveNav("grafana")}
                                    className={`w-full flex items-center space-x-2.5 px-3 py-2 rounded text-xs font-medium transition ${
                                        activeNav === 'grafana' ? 'bg-white/[0.08] text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-white/[0.02]'
                                    }`}
                                >
                                    <span>📊</span>
                                    <span>Grafana Suite</span>
                                    <span className="ml-auto text-[9px] font-mono bg-orange-500/10 text-orange-400 px-1.5 py-0.5 rounded border border-orange-500/20 font-medium">
                                        GRAFANA
                                    </span>
                                </button>

                                <button
                                    onClick={() => setActiveNav("memory")}
                                    className={`w-full flex items-center space-x-2.5 px-3 py-2 rounded text-xs font-medium transition ${
                                        activeNav === 'memory' ? 'bg-white/[0.08] text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-white/[0.02]'
                                    }`}
                                >
                                    <span>🗃️</span>
                                    <span>Incident Memory</span>
                                    {incidentsList.length > 0 && (
                                        <span className="ml-auto text-[10px] font-mono bg-white/5 px-1.5 py-0.2 rounded text-slate-400">
                                            {incidentsList.length}
                                        </span>
                                    )}
                                </button>
                            </nav>

                            {/* Active Pipeline Status */}
                            <div className="matte-card-subtle p-3 space-y-2">
                                <div className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">DevOps Pipeline</div>
                                <div className="space-y-1.5 text-[11px] font-mono">
                                    <div className="flex items-center space-x-2">
                                        <span className={runState === 'RUNNING' ? 'text-amber-400 animate-pulse' : (metrics.length > 0 ? 'text-emerald-400' : 'text-slate-600')}>
                                            {runState === 'RUNNING' ? '●' : (metrics.length > 0 ? '✓' : '○')}
                                        </span>
                                        <span className="text-slate-300">1. SIMULATE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={metrics.length > 0 ? 'text-emerald-400' : 'text-slate-600'}>
                                            {metrics.length > 0 ? '✓' : '○'}
                                        </span>
                                        <span className="text-slate-300">2. OBSERVE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={currentTest?.breaking_point_users ? 'text-red-400' : 'text-slate-600'}>
                                            {currentTest?.breaking_point_users ? '✓' : '○'}
                                        </span>
                                        <span className="text-slate-300">3. DETECT</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={diagnosis ? 'text-emerald-400' : (runState === 'ANALYZING' ? 'text-amber-400 animate-pulse' : 'text-slate-600')}>
                                            {diagnosis ? '✓' : (runState === 'ANALYZING' ? '●' : '○')}
                                        </span>
                                        <span className="text-slate-300">4. DIAGNOSE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={remediation?.is_applied ? 'text-emerald-400' : (remediation ? 'text-indigo-400' : 'text-slate-600')}>
                                            {remediation?.is_applied ? '✓' : (remediation ? '→' : '○')}
                                        </span>
                                        <span className="text-slate-300">5. REMEDIATE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={verification?.verified ? 'text-emerald-400' : 'text-slate-600'}>
                                            {verification?.verified ? '✓' : '○'}
                                        </span>
                                        <span className="text-slate-300">6. LEARN</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Environment metadata */}
                        <div className="space-y-1 text-[10px] font-mono text-slate-500 pt-3 border-t border-white/[0.04]">
                            <div>ENV: LOCAL / DOCKER</div>
                            <div>BACKEND: :8001</div>
                            <div>TARGET: :8002</div>
                        </div>
                    </aside>

                    {/* MAIN VIEWPORT */}
                    <div className="pl-56 flex-1 flex flex-col min-h-screen">
                        
                        {/* 1. TOP HEADER BAR */}
                        <header className="h-14 border-b border-white/[0.05] px-6 flex items-center justify-between bg-[#0b0c11] sticky top-0 z-20">
                            <div className="flex items-center space-x-4">
                                <div className="flex items-center space-x-2">
                                    <span className="text-xs text-slate-400">Target:</span>
                                    <input 
                                        type="text" 
                                        value={targetUrl}
                                        onChange={(e) => setTargetUrl(e.target.value)}
                                        disabled={runState === 'RUNNING'}
                                        className="bg-[#12141c] border border-white/[0.06] rounded px-2.5 py-1 text-xs font-mono text-slate-200 outline-none w-72 focus:border-white/20"
                                    />
                                </div>

                                <div className="flex items-center space-x-2 text-xs font-mono">
                                    <span className="text-slate-500">RUN:</span>
                                    <span className="text-slate-300 font-semibold">#{currentTest?.id ? String(currentTest.id).padStart(3, '0') : '001'}</span>
                                </div>
                            </div>

                            <div className="flex items-center space-x-4 text-xs font-mono">
                                <div className="flex items-center space-x-2">
                                    <span className="text-slate-500">Status:</span>
                                    <span className={`px-2 py-0.5 rounded font-semibold uppercase text-[10px] ${
                                        runState === 'RUNNING' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/20 animate-pulse' :
                                        runState === 'BREAKING_POINT_DETECTED' ? 'bg-red-500/10 text-red-300 border border-red-500/20' :
                                        runState === 'COMPLETED' ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' :
                                        'bg-white/5 text-slate-400'
                                    }`}>
                                        ● {runState}
                                    </span>
                                </div>

                                <div className="text-slate-400 pl-3 border-l border-white/[0.05]">
                                    Duration: <span className="text-white font-semibold">{testTimer}</span>
                                </div>
                            </div>
                        </header>

                        {/* 2. MAIN WORKSPACE */}
                        {activeNav === "dashboard" ? (
                            <div className="p-6 space-y-5 max-w-[1600px] w-full mx-auto">
                                
                                {/* MINIMAL CONTROLLER & SINGLE ACTIVE SCENARIO */}
                                <div className="matte-card p-5 space-y-4">
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                        <div>
                                            <h1 className="text-sm font-semibold text-white flex items-center space-x-2">
                                                <span>Autonomous Stress Testing Engine</span>
                                                <span className="text-xs font-normal text-slate-500 font-mono">(Step-Ramp Workload)</span>
                                            </h1>

                                            )}
                                        </div>

                                        {/* 3. CODE REMEDIATION & VERIFICATION CARD */}
                                        <div className="matte-card p-4 space-y-3">
                                            <div className="flex items-center justify-between pb-2 border-b border-white/[0.05]">
                                                <span className="text-xs font-semibold text-white uppercase font-mono">Remediation Prescription</span>
                                                <span className={`text-[10px] font-mono px-2 py-0.5 rounded font-semibold ${
                                                    remediation?.is_applied ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : (remediation ? 'bg-amber-500/10 text-amber-300 border border-amber-500/20' : 'bg-white/5 text-slate-400')
                                                }`}>
                                                    {remediation?.is_applied ? 'PATCH APPLIED' : (remediation ? 'PATCH READY' : 'IDLE')}
                                                </span>
                                            </div>

                                            {/* Patch Code Diff or Advice Box */}
                                            <div className="bg-[#08090d] rounded p-2.5 font-mono text-xs text-slate-300 border border-white/[0.04] max-h-36 overflow-y-auto">
                                                {isExternalTarget ? (
                                                    <div className="space-y-1 text-[11px] leading-relaxed">
                                                        <div className="text-amber-300 font-semibold">🌐 Third-Party External API:</div>
                                                        <div className="text-slate-400">Prescribing consumer-side resilience pattern:</div>
                                                        <pre className="text-emerald-400 mt-1 text-[10px] whitespace-pre-wrap">{remediation?.architecture_advice || "1. Configure Circuit Breaker.\n2. Set HTTP client timeout: 2.0s.\n3. Offload downstream calls to background worker queue."}</pre>
                                                    </div>
                                                ) : remediation?.patch_diff ? (
                                                    <pre className="text-emerald-400 whitespace-pre-wrap text-[11px] leading-relaxed">{remediation.patch_diff}</pre>
                                                ) : (
                                                    <div className="py-4 text-center text-slate-500 italic text-[11px]">
                                                        Awaiting stress test breaking point to generate automated code patch.
                                                    </div>
                                                )}
                                            </div>

                                            {patchStatusMsg && (
                                                <div className="text-[11px] font-mono text-amber-300 py-0.5">
                                                    ⚙ {patchStatusMsg}
                                                </div>
                                            )}

                                            {/* REAL MEASURED BEFORE VS AFTER VERIFICATION COMPARISON */}
                                            {verification && (
                                                <div className="mt-3 p-3 rounded bg-[#0b0f17] border border-white/[0.08] space-y-2 text-xs font-mono">
                                                    <div className="flex items-center justify-between border-b border-white/[0.05] pb-1.5">
                                                        <span className="font-semibold text-white">Verification Benchmark:</span>
                                                        <span className={`px-2 py-0.5 rounded font-semibold text-[10px] ${verification.success ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`}>
                                                            {verification.success ? 'PASSED STABILIZATION' : 'REGRESSION'}
                                                        </span>
                                                    </div>

                                                    <div className="grid grid-cols-2 gap-2 text-[11px]">
                                                        <div className="p-2 rounded bg-black/30 border border-white/[0.03]">
                                                            <div className="text-slate-500 uppercase text-[9px]">BEFORE FIX</div>
                                                            <div className="text-white mt-0.5">P95: <strong>{verification.before?.p95_ms}ms</strong></div>
                                                            <div className="text-slate-400">RPS: {verification.before?.rps}</div>
                                                            <div className="text-red-400">Error: {(verification.before?.error_rate * 100).toFixed(1)}%</div>
                                                        </div>

                                                        <div className="p-2 rounded bg-emerald-950/20 border border-emerald-500/20">
                                                            <div className="text-emerald-400 uppercase text-[9px]">AFTER FIX</div>
                                                            <div className="text-white mt-0.5">P95: <strong>{verification.after?.p95_ms}ms</strong></div>
                                                            <div className="text-slate-300">RPS: {verification.after?.rps}</div>
                                                            <div className="text-emerald-400">Error: {(verification.after?.error_rate * 100).toFixed(1)}%</div>
                                                        </div>
                                                    </div>

                                                    <div className="text-[10px] text-slate-300 leading-relaxed pt-1">
                                                        {verification.summary}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* 4. REAL RUN TIMELINE & LOGS */}
                                        <div className="matte-card p-4 space-y-2">
                                            <div className="text-xs font-semibold text-white uppercase font-mono flex items-center justify-between">
                                                <span>DevOps Run Timeline</span>
                                                <span className="text-[10px] text-slate-500">Live Engine Logs</span>
                                            </div>
                                            <div className="bg-[#08090d] rounded p-2 text-[11px] font-mono text-slate-400 border border-white/[0.04] h-32 overflow-y-auto space-y-1">
                                                {timeline.length > 0 ? (
                                                    timeline.map((item, idx) => (
                                                        <div key={idx} className="flex items-start space-x-2">
                                                            <span className="text-slate-600 shrink-0">{item.time}</span>
                                                            <span className={`shrink-0 font-semibold text-[9px] px-1 rounded ${
                                                                item.tag === 'ALERT' ? 'bg-red-500/10 text-red-400' :
                                                                item.tag === 'AI' ? 'bg-indigo-500/10 text-indigo-400' :
                                                                item.tag === 'SUCCESS' || item.tag === 'VERIFIED' ? 'bg-emerald-500/10 text-emerald-400' :
                                                                'bg-white/5 text-slate-300'
                                                            }`}>
                                                                {item.tag}
                                                            </span>
                                                            <span className="text-slate-300">{item.text}</span>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div className="text-slate-600 italic text-center py-4">Click "Run Stress Test" to begin engine execution log.</div>
                                                )}
                                            </div>
                                        </div>

                                    </div>

                                </div>

                            </div>
                        ) : activeNav === "grafana" ? (
                            /* FULL GRAFANA OBSERVABILITY SUITE VIEW */
                            <div className="p-6 space-y-6 max-w-[1700px] w-full mx-auto">
                                <div className="matte-card p-5 space-y-4">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-white/[0.05]">
                                        <div>
                                            <div className="flex items-center space-x-2">
                                                <span className="text-lg">📊</span>
                                                <h2 className="text-base font-semibold text-white">Grafana Observability Suite</h2>
                                                <span className="text-[10px] font-mono bg-orange-500/10 text-orange-400 px-2 py-0.5 rounded border border-orange-500/20">
                                                    LIVE PROVISIONED
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-400 mt-0.5 font-mono">
                                                Direct connection to Prometheus metrics engine (1s scrape interval). Quantiles, RPS, Error Rates & Container CPU/Mem.
                                            </p>
                                        </div>
                                        
                                        <div className="flex items-center space-x-3 font-mono text-xs">
                                            <button
                                                onClick={() => setGrafanaRefreshKey(Date.now())}
                                                className="px-3 py-1.5 rounded bg-white/5 hover:bg-white/10 text-white transition flex items-center space-x-1.5 border border-white/[0.05]"
                                            >
                                                <span>🔄</span>
                                                <span>Refresh Dashboard</span>
                                            </button>
                                            <a
                                                href="http://localhost:3000/d/loadmind-observability/loadmind-performance-stress-observability?orgId=1&refresh=1s"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="px-3 py-1.5 rounded bg-orange-600 hover:bg-orange-500 text-white font-semibold transition flex items-center space-x-1.5"
                                            >
                                                <span>Launch Full Grafana UI ↗</span>
                                            </a>
                                        </div>
                                    </div>

                                    {/* Full Embedded Grafana Dashboard */}
                                    <div className="w-full h-[760px] rounded border border-white/[0.05] overflow-hidden bg-[#08090d]">
                                        <iframe
                                            src={`http://localhost:3000/d/loadmind-observability/loadmind-performance-stress-observability?orgId=1&refresh=1s&theme=dark&kiosk&t=${grafanaRefreshKey}`}
                                            className="w-full h-full border-0"
                                            title="Full Grafana Observability Dashboard"
                                        ></iframe>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* AI INCIDENT MEMORY & SELF-LEARNING EXPLORER VIEW */
                            <div className="p-6 space-y-6 max-w-6xl w-full mx-auto">
                                <div className="matte-card p-5 space-y-4">
                                    <div className="flex items-center justify-between pb-3 border-b border-white/[0.05]">
                                        <div>
                                            <h2 className="text-base font-semibold text-white">Hybrid AI Incident Memory & Self-Learning System</h2>
                                            <p className="text-xs text-slate-400 mt-0.5">
                                                ChromaDB (Vector Failure Signatures) + PostgreSQL (Learned Patterns History)
                                            </p>
                                        </div>
                                        <button 
                                            onClick={() => setActiveNav("dashboard")}
                                            className="px-3 py-1.5 rounded text-xs font-mono bg-white/5 hover:bg-white/10 text-white transition border border-white/[0.05]"
                                        >
                                            ← Back to Stress Dashboard
                                        </button>
                                    </div>

                                    {/* Stats row */}
                                    <div className="grid grid-cols-3 gap-4 font-mono text-center">
                                        <div className="matte-card-subtle p-3">
                                            <div className="text-[10px] text-slate-400 uppercase">Total Incidents Stored</div>
                                            <div className="text-xl font-bold text-white mt-1">
                                                {incidentsList.length || memoryStats?.total_incidents_stored || 0}
                                            </div>
                                        </div>
                                        <div className="matte-card-subtle p-3">
                                            <div className="text-[10px] text-slate-400 uppercase">Learned Signatures in ChromaDB</div>
                                            <div className="text-xl font-bold text-emerald-400 mt-1">
                                                {memoryStats?.signatures_learned || memoryStats?.patterns?.length || 0}
                                            </div>
                                        </div>
                                        <div className="matte-card-subtle p-3">
                                            <div className="text-[10px] text-slate-400 uppercase">Embedding Vector Dimension</div>
                                            <div className="text-xs font-bold text-slate-200 mt-2">
                                                all-MiniLM-L6-v2 (384-d)
                                            </div>
                                        </div>
                                    </div>

                                    {/* Incident History List */}
                                    <div className="space-y-3 pt-2">
                                        <div className="text-xs font-semibold text-slate-300 uppercase font-mono">
                                            Learned Failure Signatures & Recalled Remediations
                                        </div>

                                        {incidentsList.length > 0 ? (
                                            incidentsList.map((inc) => (
                                                <div key={inc.id} className="p-3.5 rounded bg-[#12141c] border border-white/[0.04] space-y-2 text-xs font-mono">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-white font-semibold">Incident #{inc.id}</span>
                                                            <span className="text-slate-300 font-semibold">{inc.name || inc.failure_mode}</span>
                                                        </div>
                                                        <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">
                                                            Stored in ChromaDB + Postgres
                                                        </span>
                                                    </div>

                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-slate-400 text-[11px]">
                                                        <div>Target: <span className="text-white">{inc.target_app_url}</span></div>
                                                        <div>Breaking Point: <span className="text-white">{inc.breaking_point_users || 'N/A'} users</span></div>
                                                        <div>P95 Latency: <span className="text-white">{inc.p95_ms || 'N/A'} ms</span></div>
                                                        <div>Root Cause: <span className="text-slate-200 font-semibold">{inc.diagnosis || inc.failure_mode}</span></div>
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="py-8 text-center text-slate-500 text-xs font-mono">
                                                No incidents stored yet. Run stress tests to populate hybrid memory.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* FOOTER */}
                        <footer className="mt-auto px-6 py-4 border-t border-white/[0.03] flex items-center justify-between text-[10px] text-slate-500 font-mono">
                            <div>LOADMIND DEVOPS AUTOMATION • SIMULATE ➔ OBSERVE ➔ DETECT ➔ DIAGNOSE ➔ REMEDIATE ➔ LEARN</div>
                            <div>BREAKING THRESHOLD: P95 &gt; 1000ms</div>
                        </footer>

                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
