<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadMind — Autonomous API Stress Testing & AI Performance Engineering</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #090b10;
            --card-bg: #0f1219;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .devops-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .devops-card-subtle {
            background-color: #131722;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCENARIOS = [
            {
                id: "blocking_async",
                name: "E-Commerce Checkout Stress",
                endpoint: "/checkout/process",
                target: "http://localhost:8002/checkout/process",
                method: "GET",
                persona: "e_commerce_shopper",
                load_profile: "Step Ramp",
                concurrency: 12,
                duration: 10,
                failure_mode: "blocking_async",
                description: "Synchronous time.sleep(1.0) blocks the FastAPI single-threaded event loop."
            },
            {
                id: "n_plus_one",
                name: "Database Heavy /products",
                endpoint: "/products",
                target: "http://localhost:8002/products",
                method: "GET",
                persona: "heavy_read",
                load_profile: "Step Ramp",
                concurrency: 15,
                duration: 12,
                failure_mode: "n_plus_one",
                description: "N+1 query amplification: executes a separate SQL query per product vendor in loop."
            },
            {
                id: "db_pool",
                name: "Connection Pool /db-status",
                endpoint: "/db-status",
                target: "http://localhost:8002/db-status",
                method: "GET",
                persona: "standard",
                load_profile: "Step Ramp",
                concurrency: 15,
                duration: 12,
                failure_mode: "db_pool",
                description: "Holds database connection with pg_sleep(2.0), exhausting PostgreSQL pool limit."
            },
            {
                id: "public_httpbin",
                name: "Public Internet Delayed API",
                endpoint: "/delay/1",
                target: "https://httpbin.org/delay/1",
                method: "GET",
                persona: "external_service",
                load_profile: "Step Ramp",
                concurrency: 8,
                duration: 10,
                failure_mode: "high_network_latency",
                description: "Real public internet server with artificial 1-second transit latency."
            }
        ];

        function App() {
            const [selectedScenario, setSelectedScenario] = useState(SCENARIOS[0]);
            const [targetUrl, setTargetUrl] = useState("http://localhost:8002/checkout/process");
            const [concurrencyInput, setConcurrencyInput] = useState(12);
            const [durationInput, setDurationInput] = useState(10);
            
            // Workflow States: IDLE, RUNNING, BREAKING_POINT_DETECTED, DIAGNOSIS_READY, PATCH_READY, PATCH_APPLIED, COMPLETED, FAILED
            const [runState, setRunState] = useState("IDLE");
            const [testTimer, setTestTimer] = useState("00:00");
            const [activeNav, setActiveNav] = useState("dashboard");

            // Real Data Telemetry State
            const [currentTest, setCurrentTest] = useState(null);
            const [metrics, setMetrics] = useState([]);
            const [diagnosis, setDiagnosis] = useState(null);
            const [remediation, setRemediation] = useState(null);
            const [verification, setVerification] = useState(null);
            const [memoryStats, setMemoryStats] = useState(null);
            const [incidentsList, setIncidentsList] = useState([]);
            const [similarIncidents, setSimilarIncidents] = useState([]);
            
            // Real Timeline Events Log
            const [timeline, setTimeline] = useState([]);
            const [patchApplying, setPatchApplying] = useState(false);
            const [patchStatusMsg, setPatchStatusMsg] = useState("");
            const [isVerifying, setIsVerifying] = useState(false);

            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const pollIntervalRef = useRef(null);
            const timerRef = useRef(null);

            const addTimelineEvent = (msg, tag = "INFO") => {
                const now = new Date();
                const timeStr = now.toTimeString().split(" ")[0];
                setTimeline(prev => [...prev, { time: timeStr, text: msg, tag }]);
            };

            useEffect(() => {
                loadInitialSystemData();
                return () => {
                    if (pollIntervalRef.current) clearInterval(pollIntervalRef.current);
                    if (timerRef.current) clearInterval(timerRef.current);
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, []);

            useEffect(() => {
                renderObservabilityChart();
            }, [metrics, currentTest]);

            const loadInitialSystemData = async () => {
                try {
                    const [learnRes, incRes] = await Promise.all([
                        fetch("http://localhost:8001/api/learning"),
                        fetch("http://localhost:8001/api/incidents")
                    ]);
                    if (learnRes.ok) setMemoryStats(await learnRes.json());
                    if (incRes.ok) {
                        const list = await incRes.json();
                        setIncidentsList(list);
                    }
                } catch (e) {
                    console.error("Backend health check failed:", e);
                }
            };

            const startStressTest = async (failureModeOverride = null, maxUsersOverride = null) => {
                setRunState("RUNNING");
                setMetrics([]);
                setDiagnosis(null);
                setRemediation(null);
                setVerification(null);
                setSimilarIncidents([]);
                setTimeline([]);
                setPatchStatusMsg("");

                // Prevent React synthetic MouseEvent from being treated as failureModeOverride string
                const activeMode = (typeof failureModeOverride === 'string') ? failureModeOverride : selectedScenario.failure_mode;
                const activeConcurrency = (typeof maxUsersOverride === 'number') ? maxUsersOverride : (Number(concurrencyInput) || selectedScenario.concurrency);

                addTimelineEvent(`Initiating ${selectedScenario.name}`, "START");
                addTimelineEvent(`Target: ${targetUrl} (Mode: ${activeMode})`, "CONFIG");

                let elapsed = 0;
                if (timerRef.current) clearInterval(timerRef.current);
                timerRef.current = setInterval(() => {
                    elapsed++;
                    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const s = String(elapsed % 60).padStart(2, '0');
                    setTestTimer(`${m}:${s}`);
                }, 1000);

                try {
                    const payload = {
                        name: activeMode === "none" ? `${selectedScenario.name} (Remediated Baseline)` : selectedScenario.name,
                        target_app_url: targetUrl.startsWith("http") ? targetUrl : `http://${targetUrl}`,
                        http_method: selectedScenario.method,
                        user_persona: selectedScenario.persona,
                        load_profile: "step_ramp",
                        max_concurrency: activeConcurrency,
                        duration_seconds: Number(durationInput) || selectedScenario.duration,
                        failure_mode: activeMode
                    };

                    const res = await fetch("http://localhost:8001/api/tests/start", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        setRunState("FAILED");
                        addTimelineEvent("Failed to launch load test runner on backend", "ERROR");
                        clearInterval(timerRef.current);
                        return;
                    }

                    const testObj = await res.json();
                    setCurrentTest(testObj);
                    setRunState("RUNNING");
                    addTimelineEvent(`Test Run #${testObj.id} started with step ramp load`, "EXEC");
                    pollActiveTelemetry(testObj.id);

                } catch (err) {
                    console.error("Start test fetch error:", err);
                    setRunState("FAILED");
                    addTimelineEvent(`Connection error: ${err.message}`, "ERROR");
                    clearInterval(timerRef.current);
                }
            };

            const pollActiveTelemetry = (testId) => {
                if (pollIntervalRef.current) clearInterval(pollIntervalRef.current);
                
                let detectedBpLogged = false;

                pollIntervalRef.current = setInterval(async () => {
                    try {
                        const [tRes, mRes] = await Promise.all([
                            fetch(`http://localhost:8001/api/tests/${testId}`),
                            fetch(`http://localhost:8001/api/tests/${testId}/metrics`)
                        ]);

                        if (mRes.ok) {
                            const stream = await mRes.json();
                            setMetrics(stream);

                            if (stream.length > 0) {
                                const latest = stream[stream.length - 1];
                                if ((latest.p95_ms > 1000.0 || latest.error_rate > 0.05) && !detectedBpLogged) {
                                    detectedBpLogged = true;
                                    setRunState("BREAKING_POINT_DETECTED");
                                    addTimelineEvent(`Breaking threshold exceeded: P95=${latest.p95_ms}ms, Error=${(latest.error_rate*100).toFixed(1)}% at ${latest.users} users`, "ALERT");
                                }
                            }
                        }

                        if (tRes.ok) {
                            const t = await tRes.json();
                            setCurrentTest(t);

                            if (t.status === "completed") {
                                clearInterval(pollIntervalRef.current);
                                clearInterval(timerRef.current);
                                addTimelineEvent(`Load execution completed. Peak users: ${t.breaking_point_users || concurrencyInput}`, "COMPLETE");
                                fetchAIDiagnosisAndRemediation(testId);
                                loadInitialSystemData();
                            }
                        }
                    } catch (e) {
                        console.error("Telemetry polling error:", e);
                    }
                }, 1000);
            };

            const fetchAIDiagnosisAndRemediation = async (testId) => {
                setRunState("ANALYZING");
                addTimelineEvent("Querying vector memory & Groq Diagnostician Agent...", "AI");

                try {
                    const [diagRes, remRes] = await Promise.all([
                        fetch(`http://localhost:8001/api/tests/${testId}/diagnosis`),
                        fetch(`http://localhost:8001/api/tests/${testId}/remediation`)
                    ]);

                    if (diagRes.ok) {
                        const d = await diagRes.json();
                        setDiagnosis(d);
                        setRunState("DIAGNOSIS_READY");
                        addTimelineEvent(`AI Diagnosis: ${d.primary_root_cause} (Confidence: ${Math.round(d.confidence*100)}%)`, "DIAG");
                    }

                    if (remRes.ok) {
                        const r = await remRes.json();
                        setRemediation(r);
                        setRunState(r.is_applied ? "PATCH_APPLIED" : "PATCH_READY");
                        addTimelineEvent(r.is_applied ? "Target remediation patch applied & verified" : "Target remediation patch prescription generated", "REMED");
                    } else {
                        setRunState("DIAGNOSIS_READY");
                    }

                    // Query matching incident memories
                    const memRes = await fetch("http://localhost:8001/api/learning");
                    if (memRes.ok) {
                        const memData = await memRes.json();
                        setMemoryStats(memData);
                        if (memData.patterns && diagnosis) {
                            setSimilarIncidents(memData.patterns.filter(p => p.root_cause === diagnosis?.primary_root_cause));
                        }
                    }
                } catch (e) {
                    console.error("AI diagnosis extraction error:", e);
                    setRunState("DIAGNOSIS_READY");
                    addTimelineEvent("AI diagnosis extraction error", "ERROR");
                }
            };

            const applyRemediationPatch = async () => {
                if (!currentTest) return;
                setPatchApplying(true);
                setPatchStatusMsg("Applying code diff to target-app...");
                addTimelineEvent("Applying code patch diff to target container...", "PATCH");

                try {
                    await new Promise(r => setTimeout(r, 600));
                    setPatchStatusMsg("Restarting target-app container...");
                    addTimelineEvent("Restarting target-app container via Docker API...", "DOCKER");

                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/remediate`, { method: "POST" });
                    
                    if (res.ok) {
                        const data = await res.json();
                        setRemediation(data.remediation || data);
                        setPatchStatusMsg("Target health check: 200 OK ✓");
                        addTimelineEvent("Target restarted and verified healthy", "SUCCESS");
                        setRunState("PATCH_APPLIED");
                    } else {
                        setPatchStatusMsg("Failed to apply patch");
                        addTimelineEvent("Patch application error", "ERROR");
                    }
                } catch (e) {
                    setPatchStatusMsg(`Error: ${e.message}`);
                    addTimelineEvent(`Remediation error: ${e.message}`, "ERROR");
                } finally {
                    setPatchApplying(false);
                }
            };

            const runPostFixVerification = async () => {
                if (!currentTest) return;
                setIsVerifying(true);
                addTimelineEvent("Running post-fix verification load at breaking concurrency...", "VERIFY");

                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/verify`, { method: "POST" });
                    if (res.ok) {
                        const vData = await res.json();
                        setVerification(vData);
                        setRunState("COMPLETED");
                        addTimelineEvent(vData.summary, vData.success ? "VERIFIED" : "WARN");
                        loadInitialSystemData();
                    } else {
                        addTimelineEvent("Post-fix verification run failed on backend", "ERROR");
                    }
                } catch (e) {
                    addTimelineEvent(`Verification failed: ${e.message}`, "ERROR");
                } finally {
                    setIsVerifying(false);
                }
            };

            const renderObservabilityChart = () => {
                if (!chartRef.current) return;
                const ctx = chartRef.current.getContext('2d');

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const labels = metrics.length > 0 ? metrics.map(m => m.timestamp) : ['00:00:00'];
                const p95Data = metrics.length > 0 ? metrics.map(m => m.p95_ms) : [0];
                const p50Data = metrics.length > 0 ? metrics.map(m => m.p50_ms) : [0];
                const rpsData = metrics.length > 0 ? metrics.map(m => m.rps) : [0];
                const errorData = metrics.length > 0 ? metrics.map(m => m.error_rate * 100) : [0];

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'P95 Latency (ms)',
                                data: p95Data,
                                borderColor: '#38bdf8',
                                backgroundColor: 'rgba(56, 189, 248, 0.08)',
                                fill: true,
                                borderWidth: 2,
                                pointRadius: metrics.length > 0 ? 3 : 0,
                                pointBackgroundColor: '#38bdf8',
                                tension: 0.2,
                                yAxisID: 'y'
                            },
                            {
                                label: 'P50 Latency (ms)',
                                data: p50Data,
                                borderColor: '#94a3b8',
                                backgroundColor: 'transparent',
                                borderWidth: 1.5,
                                pointRadius: 0,
                                borderDash: [2, 2],
                                tension: 0.2,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Breaking Point Threshold (1000ms)',
                                data: labels.map(() => 1000),
                                borderColor: '#ef4444',
                                backgroundColor: 'transparent',
                                borderWidth: 1.5,
                                borderDash: [6, 4],
                                pointRadius: 0,
                                tension: 0,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Throughput (req/s)',
                                data: rpsData,
                                borderColor: '#818cf8',
                                backgroundColor: 'transparent',
                                borderWidth: 1.5,
                                pointRadius: 0,
                                tension: 0.2,
                                yAxisID: 'y1'
                            },
                            {
                                label: 'Error Rate (%)',
                                data: errorData,
                                borderColor: '#f87171',
                                backgroundColor: 'transparent',
                                borderWidth: 1.2,
                                pointRadius: 0,
                                tension: 0.2,
                                yAxisID: 'y2'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 10 }, boxWidth: 12 }
                            },
                            tooltip: {
                                backgroundColor: '#0f172a',
                                borderColor: 'rgba(255,255,255,0.1)',
                                borderWidth: 1,
                                titleColor: '#fff',
                                bodyColor: '#cbd5e1',
                                titleFont: { family: 'JetBrains Mono', size: 11 },
                                bodyFont: { family: 'JetBrains Mono', size: 10 }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.04)' },
                                ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 9 }, maxRotation: 0 }
                            },
                            y: {
                                type: 'linear',
                                position: 'left',
                                title: { display: true, text: 'Latency (ms)', color: '#64748b', font: { size: 10 } },
                                grid: { color: 'rgba(255, 255, 255, 0.04)' },
                                ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 9 } }
                            },
                            y1: {
                                type: 'linear',
                                position: 'right',
                                title: { display: true, text: 'RPS', color: '#818cf8', font: { size: 10 } },
                                grid: { drawOnChartArea: false },
                                ticks: { color: '#818cf8', font: { family: 'JetBrains Mono', size: 9 } }
                            },
                            y2: {
                                type: 'linear',
                                position: 'right',
                                title: { display: false },
                                min: 0,
                                max: 100,
                                grid: { drawOnChartArea: false },
                                display: false
                            }
                        }
                    }
                });
            };

            const latestMetric = metrics.length > 0 ? metrics[metrics.length - 1] : null;

            // Compute actual status code distribution percentages
            const statusCodeCounts = latestMetric?.status_codes || {};
            const totalStatusReqs = Object.values(statusCodeCounts).reduce((a, b) => a + b, 0) || 1;

            return (
                <div className="flex min-h-screen w-full bg-[#090b10] text-slate-200">
                    
                    {/* LEFT SIDEBAR NAVIGATION */}
                    <aside className="w-56 shrink-0 border-r border-white/[0.08] flex flex-col justify-between p-4 bg-[#0c0e15] fixed top-0 bottom-0 left-0 z-30">
                        <div className="space-y-6">
                            {/* Brand Header */}
                            <div className="flex items-center space-x-2.5 px-2 pt-1">
                                <div className="w-7 h-7 rounded bg-indigo-600 flex items-center justify-center font-black text-white text-xs">
                                    LM
                                </div>
                                <div>
                                    <div className="text-sm font-bold tracking-tight text-white leading-none">LoadMind</div>
                                    <div className="text-[9px] text-slate-500 font-mono tracking-wide uppercase mt-1">Autonomous DevOps</div>
                                </div>
                            </div>

                            {/* Nav menu */}
                            <nav className="space-y-1">
                                <button
                                    onClick={() => setActiveNav("dashboard")}
                                    className={`w-full flex items-center space-x-2.5 px-3 py-2 rounded text-xs font-medium transition ${
                                        activeNav === 'dashboard' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:text-white hover:bg-white/[0.03]'
                                    }`}
                                >
                                    <span>⚡</span>
                                    <span>Stress Testing</span>
                                </button>

                                <button
                                    onClick={() => setActiveNav("memory")}
                                    className={`w-full flex items-center space-x-2.5 px-3 py-2 rounded text-xs font-medium transition ${
                                        activeNav === 'memory' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:text-white hover:bg-white/[0.03]'
                                    }`}
                                >
                                    <span>🗃️</span>
                                    <span>AI Incident Memory</span>
                                    {incidentsList.length > 0 && (
                                        <span className="ml-auto text-[10px] font-mono bg-white/10 px-1.5 py-0.2 rounded text-slate-300">
                                            {incidentsList.length}
                                        </span>
                                    )}
                                </button>
                            </nav>

                            {/* Active Pipeline Status */}
                            <div className="devops-card-subtle p-3 space-y-2 border border-white/[0.06]">
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">DevOps Pipeline</div>
                                <div className="space-y-1.5 text-[11px] font-mono">
                                    <div className="flex items-center space-x-2">
                                        <span className={runState === 'RUNNING' ? 'text-amber-400 animate-pulse' : (metrics.length > 0 ? 'text-emerald-400' : 'text-slate-600')}>
                                            {runState === 'RUNNING' ? '●' : (metrics.length > 0 ? '✓' : '○')}
                                        </span>
                                        <span className="text-slate-300">1. SIMULATE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={metrics.length > 0 ? 'text-emerald-400' : 'text-slate-600'}>
                                            {metrics.length > 0 ? '✓' : '○'}
                                        </span>
                                        <span className="text-slate-300">2. OBSERVE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={currentTest?.breaking_point_users ? 'text-red-400' : 'text-slate-600'}>
                                            {currentTest?.breaking_point_users ? '✓' : '○'}
                                        </span>
                                        <span className="text-slate-300">3. DETECT</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={diagnosis ? 'text-emerald-400' : (runState === 'ANALYZING' ? 'text-amber-400 animate-pulse' : 'text-slate-600')}>
                                            {diagnosis ? '✓' : (runState === 'ANALYZING' ? '●' : '○')}
                                        </span>
                                        <span className="text-slate-300">4. DIAGNOSE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={remediation?.is_applied ? 'text-emerald-400' : (remediation ? 'text-indigo-400' : 'text-slate-600')}>
                                            {remediation?.is_applied ? '✓' : (remediation ? '→' : '○')}
                                        </span>
                                        <span className="text-slate-300">5. REMEDIATE</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className={verification?.verified ? 'text-emerald-400' : 'text-slate-600'}>
                                            {verification?.verified ? '✓' : '○'}
                                        </span>
                                        <span className="text-slate-300">6. LEARN</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Environment metadata */}
                        <div className="space-y-1 text-[10px] font-mono text-slate-500 pt-3 border-t border-white/[0.06]">
                            <div>ENV: LOCAL / DOCKER</div>
                            <div>BACKEND: http://localhost:8001</div>
                            <div>TARGET: http://localhost:8002</div>
                        </div>
                    </aside>

                    {/* MAIN VIEWPORT */}
                    <div className="pl-56 flex-1 flex flex-col min-h-screen">
                        
                        {/* 1. TOP DEVOPS HEADER BAR */}
                        <header className="h-14 border-b border-white/[0.08] px-6 flex items-center justify-between bg-[#0b0e14] sticky top-0 z-20">
                            <div className="flex items-center space-x-4">
                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-semibold text-slate-300">Target:</span>
                                    <input 
                                        type="text" 
                                        value={targetUrl}
                                        onChange={(e) => setTargetUrl(e.target.value)}
                                        disabled={runState === 'RUNNING'}

                                                        </div>

                                                        <div className="p-2 rounded bg-emerald-950/20 border border-emerald-500/30">
                                                            <div className="text-emerald-400 uppercase text-[9px]">AFTER FIX</div>
                                                            <div className="text-white mt-0.5">P95: <strong>{verification.after?.p95_ms}ms</strong></div>
                                                            <div className="text-slate-300">RPS: {verification.after?.rps}</div>
                                                            <div className="text-emerald-400">Error: {(verification.after?.error_rate * 100).toFixed(1)}%</div>
                                                        </div>
                                                    </div>

                                                    <div className="text-[10px] text-slate-300 leading-relaxed pt-1">
                                                        {verification.summary}
                                                    </div>

                                                    {/* Autonomous Loop Continuator: Run next stress test stage on improved API */}
                                                    <div className="pt-2 border-t border-white/[0.08]">
                                                        <button
                                                            onClick={() => {
                                                                // Increase concurrency limit to stress test the newly improved endpoint without re-injecting the old failure mode
                                                                const nextConcurrency = Math.min(200, (currentTest?.breaking_point_users || 4) * 4);
                                                                setConcurrencyInput(nextConcurrency);
                                                                startStressTest("none", nextConcurrency);
                                                            }}
                                                            disabled={runState === 'RUNNING'}
                                                            className="w-full py-2 px-3 rounded text-xs font-bold font-mono bg-gradient-to-r from-emerald-600 to-indigo-600 hover:from-emerald-500 hover:to-indigo-500 text-white transition flex items-center justify-center space-x-2 shadow-lg"
                                                        >
                                                            <span>🔁</span>
                                                            <span>Run Next Stress Loop on Improved API (Ramp to {(currentTest?.breaking_point_users || 4) * 4} Users)</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* 4. REAL RUN TIMELINE & LOGS */}
                                        <div className="devops-card p-4 space-y-2">
                                            <div className="text-xs font-bold text-white uppercase font-mono flex items-center justify-between">
                                                <span>DevOps Run Timeline</span>
                                                <span className="text-[10px] text-slate-500">Live Engine Logs</span>
                                            </div>
                                            <div className="bg-[#08090d] rounded p-2 text-[11px] font-mono text-slate-400 border border-white/[0.05] h-36 overflow-y-auto space-y-1">
                                                {timeline.length > 0 ? (
                                                    timeline.map((item, idx) => (
                                                        <div key={idx} className="flex items-start space-x-2">
                                                            <span className="text-slate-600 shrink-0">{item.time}</span>
                                                            <span className={`shrink-0 font-bold text-[9px] px-1 rounded ${
                                                                item.tag === 'ALERT' ? 'bg-red-500/20 text-red-400' :
                                                                item.tag === 'AI' ? 'bg-indigo-500/20 text-indigo-400' :
                                                                item.tag === 'SUCCESS' || item.tag === 'VERIFIED' ? 'bg-emerald-500/20 text-emerald-400' :
                                                                'bg-white/10 text-slate-300'
                                                            }`}>
                                                                {item.tag}
                                                            </span>
                                                            <span className="text-slate-300">{item.text}</span>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div className="text-slate-600 italic text-center py-4">Click "Run Stress Test" to begin engine execution log.</div>
                                                )}
                                            </div>
                                        </div>

                                    </div>

                                </div>

                            </div>
                        ) : (
                            /* AI INCIDENT MEMORY & SELF-LEARNING EXPLORER VIEW */
                            <div className="p-6 space-y-6 max-w-6xl w-full mx-auto">
                                <div className="devops-card p-5 space-y-4">
                                    <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                                        <div>
                                            <h2 className="text-lg font-bold text-white">Hybrid AI Incident Memory & Self-Learning System</h2>
                                            <p className="text-xs text-slate-400 mt-0.5">
                                                ChromaDB (Vector Failure Signatures) + PostgreSQL (Learned Patterns History)
                                            </p>
                                        </div>
                                        <button 
                                            onClick={() => setActiveNav("dashboard")}
                                            className="px-3 py-1.5 rounded text-xs font-mono bg-white/10 hover:bg-white/20 text-white transition"
                                        >
                                            ← Back to Stress Dashboard
                                        </button>
                                    </div>

                                    {/* Stats row */}
                                    <div className="grid grid-cols-3 gap-4 font-mono text-center">
                                        <div className="devops-card-subtle p-3">
                                            <div className="text-[10px] text-slate-400 uppercase">Total Incidents Stored</div>
                                            <div className="text-xl font-bold text-indigo-400 mt-1">
                                                {incidentsList.length || memoryStats?.total_incidents_stored || 0}
                                            </div>
                                        </div>
                                        <div className="devops-card-subtle p-3">
                                            <div className="text-[10px] text-slate-400 uppercase">Learned Signatures in ChromaDB</div>
                                            <div className="text-xl font-bold text-emerald-400 mt-1">
                                                {memoryStats?.signatures_learned || memoryStats?.patterns?.length || 0}
                                            </div>
                                        </div>
                                        <div className="devops-card-subtle p-3">
                                            <div className="text-[10px] text-slate-400 uppercase">Embedding Vector Dimension</div>
                                            <div className="text-xs font-bold text-slate-200 mt-2">
                                                all-MiniLM-L6-v2 (384-d)
                                            </div>
                                        </div>
                                    </div>

                                    {/* Incident History List */}
                                    <div className="space-y-3 pt-2">
                                        <div className="text-xs font-bold text-slate-300 uppercase font-mono">
                                            Learned Failure Signatures & Recalled Remediations
                                        </div>

                                        {incidentsList.length > 0 ? (
                                            incidentsList.map((inc) => (
                                                <div key={inc.id} className="p-3.5 rounded-lg bg-[#0e121a] border border-white/[0.06] space-y-2 text-xs font-mono">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-indigo-400 font-bold">Incident #{inc.id}</span>
                                                            <span className="text-slate-300 font-bold">{inc.name || inc.failure_mode}</span>
                                                        </div>
                                                        <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">
                                                            Stored in ChromaDB + Postgres
                                                        </span>
                                                    </div>

                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-slate-400 text-[11px]">
                                                        <div>Target: <span className="text-white">{inc.target_app_url}</span></div>
                                                        <div>Breaking Point: <span className="text-white">{inc.breaking_point_users || 'N/A'} users</span></div>
                                                        <div>P95 Latency: <span className="text-white">{inc.p95_ms || 'N/A'} ms</span></div>
                                                        <div>Root Cause: <span className="text-indigo-300 font-bold">{inc.diagnosis || inc.failure_mode}</span></div>
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="py-8 text-center text-slate-500 text-xs font-mono">
                                                No incidents stored yet. Run stress tests to populate hybrid memory.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* FOOTER */}
                        <footer className="mt-auto px-6 py-4 border-t border-white/[0.05] flex items-center justify-between text-[10px] text-slate-500 font-mono">
                            <div>LOADMIND DEVOPS AUTOMATION • SIMULATE ➔ OBSERVE ➔ DETECT ➔ DIAGNOSE ➔ REMEDIATE ➔ LEARN</div>
                            <div>BREAKING THRESHOLD: P95 &gt; 1000ms</div>
                        </footer>

                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
