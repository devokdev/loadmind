<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadMind — Autonomous Stress Testing & Self-Learning Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090a0f;
            --glass-bg: rgba(18, 20, 29, 0.7);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(20, 24, 38, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(15, 18, 30, 0.6) 0%, transparent 40%);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.015em;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Frosted Glass Cards */
        .glass-panel {
            background: rgba(16, 18, 27, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .glass-card-interactive {
            background: rgba(20, 24, 36, 0.45);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card-interactive::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .glass-card-interactive:hover {
            transform: translateY(-2px);
            background: rgba(25, 30, 46, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.5);
        }

        .glass-card-active {
            background: rgba(25, 32, 50, 0.8) !important;
            border-color: rgba(99, 102, 241, 0.4) !important;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.15);
        }

        .glass-input {
            background: rgba(14, 16, 24, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #f3f4f6;
            outline: none;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Glowing Accent Badges & Buttons */
        .glass-btn-primary {
            background: #ffffff;
            color: #090a0f;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        .glass-btn-primary:hover:not(:disabled) {
            background: #e5e7eb;
            transform: scale(1.02);
            box-shadow: 0 6px 24px rgba(255, 255, 255, 0.25);
        }

        .glass-btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d1d5db;
            border-radius: 9999px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .glass-btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .mesh-gradient-sphere {
            position: relative;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 35% 35%, #4f46e5 0%, #1e1b4b 50%, #090a0f 90%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            filter: blur(2px);
            animation: morphSphere 12s ease-in-out infinite alternate;
            box-shadow: inset 0 0 50px rgba(99, 102, 241, 0.5), 0 0 60px rgba(79, 70, 229, 0.2);
        }

        @keyframes morphSphere {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg); }
            50% { border-radius: 60% 40% 30% 70% / 50% 30% 70% 40%; transform: rotate(180deg); }
            100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(360deg); }
        }

        /* Subtle modern scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen antialiased flex text-slate-100">
    <div id="root" class="w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DEMO_PRESETS = [
            {
                id: "ecom",
                name: "E-Commerce Checkout Stress",
                subtitle: "Real checkout flow under sudden traffic spikes.",
                target: "http://localhost:8002/checkout/process",
                method: "GET",
                persona: "e_commerce_shopper",
                concurrency: 120,
                duration: 20,
                failure_mode: "blocking_async",
                icon: "🛒"
            },
            {
                id: "db_heavy",
                name: "Database Heavy /products",
                subtitle: "Heavy read queries on product catalog.",
                target: "http://localhost:8002/products",
                method: "GET",
                persona: "heavy_read",
                concurrency: 80,
                duration: 20,
                failure_mode: "n_plus_one",
                icon: "🗄️"
            },
            {
                id: "login_surge",
                name: "User Login Surge",
                subtitle: "Massive login attempts with pool pressure.",
                target: "http://localhost:8002/db-status",
                method: "GET",
                persona: "standard",
                concurrency: 100,
                duration: 20,
                failure_mode: "db_pool",
                icon: "👤"
            },
            {
                id: "spiky_burst",
                name: "Spiky Aggressive Burst",
                subtitle: "Short high intensity bursts to find breaking points.",
                target: "https://httpbin.org/get",
                method: "GET",
                persona: "aggressive_burst",
                concurrency: 60,
                duration: 15,
                failure_mode: "none",
                icon: "⚡"
            }
        ];

        function App() {
            // Selected Preset & Config
            const [selectedPresetId, setSelectedPresetId] = useState("ecom");
            const [targetUrl, setTargetUrl] = useState("http://localhost:8002/checkout/process");
            const [httpMethod, setHttpMethod] = useState("GET");
            const [userPersona, setUserPersona] = useState("e_commerce_shopper");
            const [loadProfile, setLoadProfile] = useState("step_ramp");
            const [maxConcurrency, setMaxConcurrency] = useState(120);
            const [testDuration, setTestDuration] = useState(20);
            const [failureMode, setFailureMode] = useState("blocking_async");

            // Navigation
            const [activeNav, setActiveNav] = useState("home"); // 'home', 'scenarios', 'memory', 'reports', 'settings'
            const [codeTab, setCodeTab] = useState("diff"); // 'diff', 'arch'

            // Execution & Live Data State
            const [currentTest, setCurrentTest] = useState(null);
            const [testMetrics, setTestMetrics] = useState([]);
            const [diagnosis, setDiagnosis] = useState(null);
            const [remediation, setRemediation] = useState(null);
            const [verification, setVerification] = useState(null);
            const [incidents, setIncidents] = useState([]);
            const [learningStats, setLearningStats] = useState(null);
            const [isTesting, setIsTesting] = useState(false);
            const [isVerifying, setIsVerifying] = useState(false);
            const [testTimer, setTestTimer] = useState("00:00");
            const [elapsedSeconds, setElapsedSeconds] = useState(0);

            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const pollingTimer = useRef(null);
            const timerInterval = useRef(null);

            // Fetch initial state
            useEffect(() => {
                fetchIncidents();
                fetchLearningStats();
                return () => {
                    if (pollingTimer.current) clearInterval(pollingTimer.current);
                    if (timerInterval.current) clearInterval(timerInterval.current);
                };
            }, []);

            // Chart rendering
            useEffect(() => {
                if (chartRef.current && testMetrics.length > 0) {
                    renderWaveformChart();
                }
            }, [testMetrics]);

            const fetchIncidents = async () => {
                try {
                    const res = await fetch("http://localhost:8001/api/incidents");
                    if (res.ok) {
                        const data = await res.json();
                        setIncidents(data);
                    }
                } catch (e) {}
            };

            const fetchLearningStats = async () => {
                try {
                    const res = await fetch("http://localhost:8001/api/learning");
                    if (res.ok) {
                        const data = await res.json();
                        setLearningStats(data);
                    }
                } catch (e) {}
            };

            const handleSelectPreset = (p) => {
                setSelectedPresetId(p.id);
                setTargetUrl(p.target);
                setHttpMethod(p.method);
                setUserPersona(p.persona);
                setMaxConcurrency(p.concurrency);
                setTestDuration(p.duration);
                setFailureMode(p.failure_mode);
            };

            const startStressTest = async () => {
                setIsTesting(true);
                setDiagnosis(null);
                setRemediation(null);
                setVerification(null);
                setTestMetrics([]);
                setElapsedSeconds(0);

                if (timerInterval.current) clearInterval(timerInterval.current);
                timerInterval.current = setInterval(() => {
                    setElapsedSeconds(prev => {
                        const next = prev + 1;
                        const mins = String(Math.floor(next / 60)).padStart(2, '0');
                        const secs = String(next % 60).padStart(2, '0');
                        setTestTimer(`${mins}:${secs}`);
                        return next;
                    });
                }, 1000);

                try {
                    const payload = {
                        name: `${DEMO_PRESETS.find(p => p.id === selectedPresetId)?.name || 'Stress Test'}`,
                        target_app_url: targetUrl,
                        http_method: httpMethod,
                        user_persona: userPersona,
                        load_profile: loadProfile,
                        max_concurrency: parseInt(maxConcurrency),
                        duration_seconds: parseInt(testDuration),
                        failure_mode: failureMode
                    };

                    const res = await fetch("http://localhost:8001/api/tests/start", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!res.ok) throw new Error("Failed to start test");
                    const test = await res.json();
                    setCurrentTest(test);
                    pollTestExecution(test.id);
                } catch (e) {
                    setIsTesting(false);
                    if (timerInterval.current) clearInterval(timerInterval.current);
                }
            };

            const pollTestExecution = (id) => {
                if (pollingTimer.current) clearInterval(pollingTimer.current);

                pollingTimer.current = setInterval(async () => {
                    try {
                        const [testRes, metricsRes] = await Promise.all([
                            fetch(`http://localhost:8001/api/tests/${id}`),
                            fetch(`http://localhost:8001/api/tests/${id}/metrics`)
                        ]);

                        if (testRes.ok) {
                            const test = await testRes.json();
                            setCurrentTest(test);

                            if (metricsRes.ok) {
                                const metrics = await metricsRes.json();
                                setTestMetrics(metrics);
                            }

                            if (test.status === "completed") {
                                clearInterval(pollingTimer.current);
                                if (timerInterval.current) clearInterval(timerInterval.current);
                                setIsTesting(false);
                                fetchDiagnosisAndRemediation(id);
                                fetchIncidents();
                                fetchLearningStats();
                            }
                        }
                    } catch (e) {}
                }, 1000);
            };

            const fetchDiagnosisAndRemediation = async (id) => {
                try {
                    const diagRes = await fetch(`http://localhost:8001/api/tests/${id}/diagnosis`);
                    if (diagRes.ok) {
                        const diagData = await diagRes.json();
                        setDiagnosis(diagData);
                    }

                    const remRes = await fetch(`http://localhost:8001/api/tests/${id}/remediation`);
                    if (remRes.ok) {
                        const remData = await remRes.json();
                        setRemediation(remData);
                    }
                } catch (e) {
                    console.error("Error fetching AI output", e);
                }
            };

            const applyFix = async () => {
                if (!currentTest) return;
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/remediate`, { method: "POST" });
                    const data = await res.json();
                    setRemediation(data.remediation);
                } catch (e) {}
            };

            const verifyFix = async () => {
                if (!currentTest) return;
                setIsVerifying(true);
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/verify`, { method: "POST" });
                    const data = await res.json();
                    setVerification(data);
                    setIsVerifying(false);
                    fetchIncidents();
                    fetchLearningStats();
                } catch (e) {
                    setIsVerifying(false);
                }
            };

            const renderWaveformChart = () => {
                const ctx = chartRef.current.getContext('2d');
                const labels = testMetrics.map((m, i) => m.timestamp || `${i}s`);
                const p50s = testMetrics.map(m => m.p50_ms || 50);
                const p95s = testMetrics.map(m => m.p95_ms || 100);
                const p99s = testMetrics.map(m => m.p99_ms || 120);
                const rpss = testMetrics.map(m => m.rps || 0);

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                // Gradients for fluid wave effect
                const gradP95 = ctx.createLinearGradient(0, 0, 0, 300);
                gradP95.addColorStop(0, 'rgba(239, 68, 68, 0.35)');
                gradP95.addColorStop(1, 'rgba(239, 68, 68, 0.0)');

                const gradRps = ctx.createLinearGradient(0, 0, 0, 300);
                gradRps.addColorStop(0, 'rgba(99, 102, 241, 0.4)');
                gradRps.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'P95 Latency',
                                data: p95s,
                                borderColor: '#f87171',
                                backgroundColor: gradP95,
                                fill: true,
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.4,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Throughput (RPS)',
                                data: rpss,
                                borderColor: '#818cf8',
                                backgroundColor: gradRps,
                                fill: true,
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.4,
                                yAxisID: 'y1'
                            },
                            {
                                label: 'P50 Latency',
                                data: p50s,
                                borderColor: '#6b7280',
                                backgroundColor: 'transparent',
                                borderWidth: 1.5,
                                borderDash: [3, 3],
                                pointRadius: 0,
                                tension: 0.4,
                                yAxisID: 'y'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(15, 18, 28, 0.9)',
                                borderColor: 'rgba(255, 255, 255, 0.1)',
                                borderWidth: 1,
                                titleColor: '#ffffff',
                                bodyColor: '#cbd5e1',
                                padding: 10,
                                boxPadding: 4,
                                cornerRadius: 8
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.03)' },
                                ticks: { color: '#6b7280', font: { size: 10 } }
                            },
                            y: {
                                type: 'linear',
                                position: 'left',
                                grid: { color: 'rgba(255, 255, 255, 0.03)' },
                                ticks: { color: '#6b7280', font: { size: 10 } }
                            },
                            y1: {
                                type: 'linear',
                                position: 'right',
                                grid: { drawOnChartArea: false },
                                ticks: { color: '#6b7280', font: { size: 10 } }
                            }
                        }
                    }
                });
            };

            const latestMetric = testMetrics.length > 0 ? testMetrics[testMetrics.length - 1] : null;

            return (
                <div className="flex min-h-screen w-full bg-[#090a0f]">
                    
                    {/* LEFT COMPACT SIDEBAR */}
                    <aside className="w-64 border-r border-white/5 flex flex-col justify-between p-5 bg-[#0b0d14]/80 backdrop-blur-xl shrink-0">
                        <div className="space-y-8">
                            {/* Brand Header */}
                            <div className="flex items-center space-x-3 px-1">
                                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                                    ⚡
                                </div>
                                <div>
                                    <div className="text-base font-bold tracking-tight text-white flex items-center space-x-1.5">
                                        <span>LoadMind</span>
                                    </div>
                                    <div className="text-[10px] text-slate-400 tracking-wider uppercase font-medium">STRESS • DIAGNOSE • EVOLVE</div>
                                </div>
                            </div>

                            {/* Nav Menu */}
                            <nav className="space-y-1.5">
                                {[
                                    { id: "home", label: "Home", icon: "🏠" },
                                    { id: "scenarios", label: "Scenarios", icon: "🎛️" },
                                    { id: "memory", label: "AI Memory", icon: "🧠" },
                                    { id: "reports", label: "Reports", icon: "📄" },
                                    { id: "settings", label: "Settings", icon: "⚙️" },
                                ].map((item) => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveNav(item.id)}
                                        className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-medium transition-all ${
                                            activeNav === item.id 
                                                ? 'bg-white/10 text-white shadow-sm border border-white/10' 
                                                : 'text-slate-400 hover:text-white hover:bg-white/5'
                                        }`}
                                    >
                                        <span className="text-sm">{item.icon}</span>
                                        <span>{item.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* Bottom App Info */}
                        <div className="pt-4 border-t border-white/5 space-y-2 px-1">
                            <div className="text-[11px] text-slate-500 font-medium">
                                <div>Better Systems</div>
                                <div>Every Run</div>
                            </div>
                            <div className="text-[10px] text-slate-600 font-mono">v1.2.0 • Groq Core</div>
                        </div>
                    </aside>

                    {/* MAIN SCROLLABLE CONTENT */}
                    <main className="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
                        
                        {/* TOP HEADER BAR */}
                        <header className="flex items-center justify-between pb-2">
                            {/* Target Pill / Input */}
                            <div className="flex items-center space-x-2 bg-[#121520] border border-white/10 rounded-full px-3.5 py-1.5">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span className="text-xs font-medium text-slate-300">Target Connected:</span>
                                <input 
                                    type="text" 
                                    value={targetUrl}
                                    onChange={(e) => setTargetUrl(e.target.value)}
                                    disabled={isTesting}
                                    className="bg-transparent text-xs text-white font-mono outline-none border-none w-56 md:w-80"
                                />
                            </div>

                            {/* User / Engine Profile */}
                            <div className="flex items-center space-x-3">
                                <div className="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white cursor-pointer transition">
                                    ⚙️
                                </div>
                                <div className="flex items-center space-x-2.5 bg-white/5 border border-white/10 rounded-full pl-2 pr-3 py-1">
                                    <div className="w-6 h-6 rounded-full bg-indigo-500/20 text-indigo-400 font-semibold text-[11px] flex items-center justify-center">
                                        LM
                                    </div>
                                    <div className="text-left">
                                        <div className="text-xs font-semibold text-white leading-tight">Engineering</div>
                                        <div className="text-[10px] text-slate-400 leading-tight">Autonomous Lab</div>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* HERO BANNER: "Find breaking points before your users do." */}
                        <div className="glass-panel p-8 relative overflow-hidden flex flex-col md:flex-row items-center justify-between">
                            <div className="space-y-4 max-w-xl z-10">
                                <div className="text-[11px] font-semibold text-indigo-400 tracking-wider uppercase font-mono">
                                    STRESS TODAY. RESILIENT TOMORROW.
                                </div>
                                <h1 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight leading-tight">
                                    Find <span className="text-white underline decoration-indigo-500/80 decoration-2 underline-offset-4">breaking points</span> before your users do.
                                </h1>
                                <p className="text-sm text-slate-300 leading-relaxed max-w-md">
                                    Simulate real-world load swarms. Let Groq Agentic AI diagnose weak spots and engineer self-healing resilience patches.
                                </p>
                                
                                <div className="pt-2 flex items-center space-x-4">
                                    <button
                                        onClick={startStressTest}
                                        disabled={isTesting || isVerifying}
                                        className="glass-btn-primary px-6 py-3 text-xs flex items-center space-x-2.5 shadow-lg shadow-white/10"
                                    >
                                        <span>▶</span>
                                        <span>{isTesting ? 'Simulating Swarm...' : 'Run a Quick Test'}</span>
                                        <span>→</span>
                                    </button>

                                    <div className="flex items-center space-x-2 text-xs text-slate-400 font-mono">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                        <span>{maxConcurrency} Users • {testDuration}s</span>
                                    </div>
                                </div>
                            </div>

                            {/* 3D Visual Mesh Object */}
                            <div className="relative mt-8 md:mt-0 flex items-center justify-center">
                                <div className="mesh-gradient-sphere"></div>
                                
                                {/* Orbital Annotation Callouts */}
                                <div className="absolute -top-3 right-4 bg-black/60 backdrop-blur-md border border-white/10 rounded-full px-3 py-1 text-[11px] text-slate-300 flex items-center space-x-1.5 shadow-lg">
                                    <span className="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                                    <span>TEST: Push limits</span>
                                </div>
                                <div className="absolute top-1/2 -right-6 bg-black/60 backdrop-blur-md border border-white/10 rounded-full px-3 py-1 text-[11px] text-slate-300 flex items-center space-x-1.5 shadow-lg">
                                    <span className="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                                    <span>DIAGNOSE: Find causes</span>
                                </div>
                                <div className="absolute -bottom-3 left-4 bg-black/60 backdrop-blur-md border border-white/10 rounded-full px-3 py-1 text-[11px] text-slate-300 flex items-center space-x-1.5 shadow-lg">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                    <span>LEARN: Get stronger</span>
                                </div>
                            </div>
                        </div>

                        {/* SECTION 2: DEMO SCENARIOS CARDS */}
                        <div className="space-y-3">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                    <h2 className="text-xs font-bold text-slate-200 uppercase tracking-wider">Demo Scenarios</h2>
                                    <span className="text-[11px] text-slate-400">• Pick a scenario. See LoadMind in action.</span>
                                </div>
                                <span className="text-xs text-slate-400 hover:text-white cursor-pointer font-medium">View all →</span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                {DEMO_PRESETS.map((preset) => {
                                    const isSelected = selectedPresetId === preset.id;
                                    return (
                                        <div
                                            key={preset.id}
                                            onClick={() => handleSelectPreset(preset)}
                                            className={`glass-card-interactive p-4 cursor-pointer flex flex-col justify-between h-36 ${isSelected ? 'glass-card-active' : ''}`}
                                        >
                                            <div className="flex items-start justify-between">
                                                <div className="text-xl p-2 rounded-lg bg-white/5 border border-white/5">
                                                    {preset.icon}
                                                </div>
                                                {isSelected && (
                                                    <span className="w-2 h-2 rounded-full bg-indigo-400 shadow-sm shadow-indigo-400"></span>
                                                )}
                                            </div>

                                            <div>
                                                <div className="text-xs font-bold text-white leading-snug">{preset.name}</div>
                                                <div className="text-[11px] text-slate-400 mt-1 line-clamp-2 leading-relaxed">{preset.subtitle}</div>
                                            </div>

                                            <div className="flex items-center justify-between pt-1">
                                                <span className="text-[10px] text-slate-500 font-mono">{preset.concurrency} Users</span>
                                                <span className="text-xs text-slate-400 group-hover:text-white">→</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* SECTION 3: 2-COLUMN SPLIT (TELEMETRY + RIGHT INSIGHTS PANEL) */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            
                            {/* LEFT COLUMN (8 Cols): Waveform Graph & Metric Tiles */}
                            <div className="lg:col-span-8 space-y-4">
                                
                                {/* Telemetry Graph Glass Card */}
                                <div className="glass-panel p-5 space-y-4">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center space-x-3">
                                            <h3 className="text-xs font-bold text-white uppercase tracking-wider">Live Telemetry</h3>
                                            <span className="flex items-center space-x-1.5 text-[11px] text-slate-400 font-mono">
                                                <span className={`w-2 h-2 rounded-full ${isTesting ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}`}></span>
                                                <span>{isTesting ? `Test Running • ${testTimer}` : 'System Standby'}</span>
                                            </span>
                                        </div>

                                        {/* Profile Selector */}
                                        <select 
                                            value={loadProfile}
                                            onChange={(e) => setLoadProfile(e.target.value)}
                                            disabled={isTesting}
                                            className="glass-input text-[11px] px-2.5 py-1 text-slate-300 font-medium"
                                        >
                                            <option value="step_ramp">Step Ramp-Up</option>
                                            <option value="spike">Traffic Spike</option>
                                            <option value="constant">Constant Sustained</option>
                                        </select>
                                    </div>

                                    {/* Waveform Canvas */}
                                    <div className="h-60 w-full bg-[#0d0f18]/60 rounded-xl border border-white/5 p-3 relative">
                                        {testMetrics.length > 0 ? (
                                            <canvas ref={chartRef}></canvas>
                                        ) : (
                                            <div className="h-full flex flex-col items-center justify-center text-xs text-slate-500 space-y-1.5">
                                                <span className="text-lg">📊</span>
                                                <span className="font-medium text-slate-400">Ready to simulate traffic</span>
                                                <span className="text-[11px]">Click 'Run a Quick Test' above to render live latency and throughput waveforms</span>
                                            </div>
                                        )}
                                    </div>

                                    {/* Waveform Legend Pills */}
                                    <div className="flex items-center space-x-6 text-[11px] text-slate-400 font-mono pt-1">
                                        <div className="flex items-center space-x-2">
                                            <span className="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                                            <span>P50: {latestMetric ? `${Math.round(latestMetric.p50_ms || 50)}ms` : '50ms'}</span>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <span className="w-2.5 h-2.5 rounded-full bg-rose-400"></span>
                                            <span>P95: {latestMetric ? `${Math.round(latestMetric.p95_ms || 95)}ms` : '95ms'}</span>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                                            <span>P99: {latestMetric ? `${Math.round(latestMetric.p99_ms || 110)}ms` : '110ms'}</span>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <span className="w-2.5 h-2.5 rounded-full bg-indigo-400"></span>
                                            <span>RPS: {latestMetric ? `${latestMetric.rps}` : '0'}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Metric Stat Tiles */}
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                    <div className="glass-panel p-3.5">
                                        <div className="text-[10px] text-slate-400 uppercase font-semibold">REQUESTS / SEC</div>
                                        <div className="text-lg font-bold text-white font-mono mt-1">
                                            {latestMetric ? latestMetric.rps : (currentTest?.avg_rps || '0.0')}
                                        </div>
                                        <div className="text-[10px] text-emerald-400 flex items-center space-x-1 mt-0.5 font-mono">
                                            <span>↑ active</span>
                                        </div>
                                    </div>

                                    <div className="glass-panel p-3.5">
                                        <div className="text-[10px] text-slate-400 uppercase font-semibold">P95 LATENCY</div>
                                        <div className="text-lg font-bold text-rose-400 font-mono mt-1">
                                            {latestMetric ? `${Math.round(latestMetric.p95_ms)} ms` : (currentTest?.p95_ms ? `${Math.round(currentTest.p95_ms)} ms` : '95 ms')}
                                        </div>
                                        <div className="text-[10px] text-slate-400 flex items-center space-x-1 mt-0.5 font-mono">
                                            <span>threshold 1.2s</span>
                                        </div>
                                    </div>

                                    <div className="glass-panel p-3.5">
                                        <div className="text-[10px] text-slate-400 uppercase font-semibold">P99 LATENCY</div>
                                        <div className="text-lg font-bold text-white font-mono mt-1">
                                            {latestMetric ? `${Math.round(latestMetric.p99_ms)} ms` : '110 ms'}
                                        </div>
                                        <div className="text-[10px] text-slate-400 flex items-center space-x-1 mt-0.5 font-mono">
                                            <span>tail lat</span>
                                        </div>
                                    </div>

                                    <div className="glass-panel p-3.5">
                                        <div className="text-[10px] text-slate-400 uppercase font-semibold">ERROR RATE</div>
                                        <div className="text-lg font-bold text-emerald-400 font-mono mt-1">
                                            {latestMetric ? `${(latestMetric.error_rate * 100).toFixed(1)}%` : '0.0%'}
                                        </div>
                                        <div className="text-[10px] text-emerald-400 flex items-center space-x-1 mt-0.5 font-mono">
                                            <span>healthy</span>
                                        </div>
                                    </div>

                                    <div className="glass-panel p-3.5">
                                        <div className="text-[10px] text-slate-400 uppercase font-semibold">TOTAL REQS</div>
                                        <div className="text-lg font-bold text-white font-mono mt-1">
                                            {currentTest?.total_requests ? currentTest.total_requests.toLocaleString() : '1,140'}
                                        </div>
                                        <div className="text-[10px] text-slate-400 flex items-center space-x-1 mt-0.5 font-mono">
                                            <span>verified</span>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            {/* RIGHT COLUMN (4 Cols): AI Insight, Remediation & Memory Stack */}
                            <div className="lg:col-span-4 space-y-4">
                                
                                {/* CARD 1: AI INSIGHT */}
                                <div className="glass-panel p-5 space-y-3.5">
                                    <div className="flex items-center justify-between pb-2 border-b border-white/5">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-sm">🧠</span>
                                            <span className="text-xs font-bold text-white tracking-wider uppercase">AI INSIGHT</span>
                                        </div>
                                        <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                            {diagnosis ? 'Analysis Complete' : 'Groq Engine Ready'}
                                        </span>
                                    </div>

                                    <div>
                                        <div className="text-[11px] text-slate-400">Root Cause Identified:</div>
                                        <div className="text-sm font-bold text-white font-mono mt-0.5">
                                            {diagnosis ? diagnosis.primary_root_cause : 'database_connection_pool_saturation'}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex items-center justify-between text-[11px] text-slate-400 mb-1">
                                            <span>Confidence</span>
                                            <span className="font-mono text-white">{diagnosis ? `${Math.round(diagnosis.confidence * 100)}%` : '92%'}</span>
                                        </div>
                                        <div className="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-indigo-500 rounded-full" 
                                                style={{ width: `${diagnosis ? Math.round(diagnosis.confidence * 100) : 92}%` }}
                                            ></div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="text-[11px] text-slate-400">Breaking Point:</div>
                                        <div className="text-xs font-semibold text-slate-200 mt-0.5">
                                            {currentTest?.breaking_point_users || 356} Concurrent Users
                                        </div>
                                    </div>

                                    <div>
                                        <div className="text-[11px] text-slate-400">Impact:</div>
                                        <div className="text-[11px] text-slate-300 leading-relaxed mt-0.5">
                                            {diagnosis?.recommended_action || 'Increased wait time and request timeouts as connection pool reached 100% saturation.'}
                                        </div>
                                    </div>
                                </div>

                                {/* CARD 2: REMEDIATION & CODE DIFF */}
                                <div className="glass-panel p-5 space-y-3.5">
                                    <div className="flex items-center justify-between pb-2 border-b border-white/5">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-sm">🛠️</span>
                                            <span className="text-xs font-bold text-white tracking-wider uppercase">REMEDIATION</span>
                                        </div>
                                        <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                                            Patch Generated
                                        </span>
                                    </div>

                                    {/* Tabs */}
                                    <div className="flex space-x-2">
                                        <button 
                                            onClick={() => setCodeTab("diff")}
                                            className={`px-3 py-1 rounded-md text-[11px] font-medium transition ${codeTab === 'diff' ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            Code Diff
                                        </button>
                                        <button 
                                            onClick={() => setCodeTab("arch")}
                                            className={`px-3 py-1 rounded-md text-[11px] font-medium transition ${codeTab === 'arch' ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            Architecture Tips
                                        </button>
                                    </div>

                                    {/* Code Diff Display */}
                                    {codeTab === 'diff' ? (
                                        <div className="bg-[#090b12] rounded-xl border border-white/5 p-3 font-mono text-[11px] overflow-x-auto max-h-36">
                                            <div className="text-slate-500 pb-1.5 border-b border-white/5 text-[10px]">connection.py</div>
                                            <pre className="text-emerald-400 pt-1.5 leading-relaxed">
{remediation?.patch_diff || `-  engine = create_engine(DATABASE_URL)
+  engine = create_engine(
+      DATABASE_URL,
+      pool_size=20,
+      max_overflow=40,
+      pool_timeout=30,
+      pool_pre_ping=True
+  )`}
                                            </pre>
                                        </div>
                                    ) : (
                                        <div className="bg-[#090b12] rounded-xl border border-white/5 p-3 text-[11px] text-slate-300 whitespace-pre-line max-h-36 overflow-y-auto">
                                            {remediation?.architecture_advice || "1. Increase connection pool size (pool_size=20, max_overflow=10).\n2. Set short pool_timeout and idle session reclamation.\n3. Ensure database sessions use context managers with guaranteed release."}
                                        </div>
                                    )}

                                    {/* Action Buttons */}
                                    <div className="pt-1 flex items-center space-x-3">
                                        {!remediation?.is_applied ? (
                                            <button
                                                onClick={applyFix}
                                                className="glass-btn-primary px-4 py-2 text-xs flex-1 flex items-center justify-center space-x-1.5"
                                            >
                                                <span>Apply Patch</span>
                                                <span>→</span>
                                            </button>
                                        ) : (
                                            <button
                                                onClick={verifyFix}
                                                disabled={isVerifying}
                                                className="glass-btn-primary px-4 py-2 text-xs flex-1 flex items-center justify-center space-x-1.5 bg-indigo-600 text-white"
                                            >
                                                <span>{isVerifying ? 'Verifying...' : 'Verify Post-Fix'}</span>
                                                <span>→</span>
                                            </button>
                                        )}
                                        <button className="glass-btn-secondary px-3 py-2 text-xs text-slate-300">
                                            View Full Diff
                                        </button>
                                    </div>
                                </div>

                                {/* CARD 3: AI MEMORY INSIGHTS ACCORDION */}
                                <div className="glass-panel p-5 space-y-3">
                                    <div className="flex items-center justify-between pb-2 border-b border-white/5">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-sm">🗃️</span>
                                            <span className="text-xs font-bold text-white tracking-wider uppercase">AI MEMORY</span>
                                        </div>
                                        <span className="text-[10px] text-slate-400 font-mono">
                                            {learningStats?.signatures_learned || 127} insights
                                        </span>
                                    </div>

                                    <div className="space-y-2">
                                        {[
                                            { id: 1, title: "db_pool_saturation", count: "12 similar cases" },
                                            { id: 2, title: "n_plus_one_queries", count: "8 similar cases" },
                                            { id: 3, title: "rate_limit_throttle", count: "6 similar cases" },
                                        ].map((item) => (
                                            <div key={item.id} className="flex items-center justify-between p-2.5 rounded-lg bg-white/5 border border-white/5 hover:border-white/10 transition cursor-pointer text-xs">
                                                <div className="flex items-center space-x-2.5">
                                                    <span className="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                                                    <span className="font-mono text-slate-200">{item.title}</span>
                                                </div>
                                                <div className="flex items-center space-x-1.5 text-slate-400 font-mono text-[10px]">
                                                    <span>{item.count}</span>
                                                    <span>›</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            </div>

                        </div>

                        {/* FOOTER BAR */}
                        <footer className="flex items-center justify-between pt-6 border-t border-white/5 text-[11px] text-slate-500 font-mono">
                            <div>REAL TRAFFIC ➔ REAL INSIGHTS ➔ STRONGER SYSTEMS</div>
                            <div>LoadMind Autonomous Resilience</div>
                        </footer>

                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
