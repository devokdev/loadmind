<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadMind — Autonomous Resilience Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d0e15;
            color: #f3f4f6;
        }
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        /* Glassmorphism style */
        .glass-panel {
            background: rgba(22, 28, 45, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [failureMode, setFailureMode] = useState("db_pool");
            const [currentTest, setCurrentTest] = useState(null);
            const [testMetrics, setTestMetrics] = useState([]);
            const [diagnosis, setDiagnosis] = useState(null);
            const [remediation, setRemediation] = useState(null);
            const [verification, setVerification] = useState(null);
            const [incidents, setIncidents] = useState([]);
            const [learningStats, setLearningStats] = useState(null);
            const [isTesting, setIsTesting] = useState(false);
            const [isVerifying, setIsVerifying] = useState(false);
            const [statusMessage, setStatusMessage] = useState("");

            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                fetchIncidents();
                fetchLearningStats();
            }, []);

            useEffect(() => {
                if (testMetrics.length > 0 && chartRef.current) {
                    renderChart();
                }
            }, [testMetrics]);

            const fetchIncidents = async () => {
                try {
                    const res = await fetch("http://localhost:8001/api/incidents");
                    const data = await res.json();
                    setIncidents(data);
                } catch (e) {
                    console.error("Failed to fetch incidents", e);
                }
            };

            const fetchLearningStats = async () => {
                try {
                    const res = await fetch("http://localhost:8001/api/learning");
                    const data = await res.json();
                    setLearningStats(data);
                } catch (e) {
                    console.error("Failed to fetch learning stats", e);
                }
            };

            const startTest = async () => {
                setIsTesting(true);
                setDiagnosis(null);
                setRemediation(null);
                setVerification(null);
                setStatusMessage("Initializing target application and starting Locust swarm...");
                
                try {
                    const res = await fetch("http://localhost:8001/api/tests/start", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ failure_mode: failureMode })
                    });
                    const test = await res.json();
                    setCurrentTest(test);
                    
                    // Start polling metrics
                    pollTest(test.id);
                } catch (e) {
                    setStatusMessage("Error starting test");
                    setIsTesting(false);
                }
            };

            const pollTest = (id) => {
                const interval = setInterval(async () => {
                    try {
                        // Check test status
                        const testRes = await fetch(`http://localhost:8001/api/tests/${id}`);
                        const test = await testRes.json();
                        setCurrentTest(test);

                        // Fetch metrics history
                        const metricsRes = await fetch(`http://localhost:8001/api/tests/${id}/metrics`);
                        const metrics = await metricsRes.json();
                        setTestMetrics(metrics);

                        if (test.status === "completed") {
                            clearInterval(interval);
                            setIsTesting(false);
                            setStatusMessage("Test completed. Analyzing breaking point...");
                            fetchDiagnosis(id);
                            fetchIncidents();
                            fetchLearningStats();
                        }
                    } catch (e) {
                        console.error("Error polling test data", e);
                    }
                }, 1000);
            };

            const fetchDiagnosis = async (id) => {
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${id}/diagnosis`);
                    const data = await res.json();
                    setDiagnosis(data);
                    setStatusMessage("Diagnosis completed. Fetching proposed remediation...");
                    fetchRemediation(id);
                } catch (e) {
                    console.error("Error fetching diagnosis", e);
                }
            };

            const fetchRemediation = async (id) => {
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${id}/remediation`);
                    const data = await res.json();
                    setRemediation(data);
                    setStatusMessage("Remediation proposed.");
                } catch (e) {
                    console.error("Error fetching remediation", e);
                }
            };

            const applyRemediation = async () => {
                if (!currentTest) return;
                setStatusMessage("Applying patch and restarting target container...");
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/remediate`, {
                        method: "POST"
                    });
                    const data = await res.json();
                    setRemediation(data.remediation);
                    setStatusMessage("Remediation applied successfully.");
                } catch (e) {
                    setStatusMessage("Error applying remediation");
                }
            };

            const verifyRemediation = async () => {
                if (!currentTest) return;
                setIsVerifying(true);
                setStatusMessage("Running verification workload against target application...");
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/verify`, {
                        method: "POST"
                    });
                    const data = await res.json();
                    setVerification(data);
                    setIsVerifying(false);
                    setStatusMessage("Verification complete.");
                    fetchIncidents();
                    fetchLearningStats();
                } catch (e) {
                    setStatusMessage("Error verifying remediation");
                    setIsVerifying(false);
                }
            };

            const renderChart = () => {
                const ctx = chartRef.current.getContext('2d');
                
                const labels = testMetrics.map((_, i) => `${i}s`);
                const errorRates = testMetrics.map(m => m.error_rate * 100);
                const latencies = testMetrics.map(m => m.p95_ms);
                const users = testMetrics.map(m => m.users);

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'P95 Latency (ms)',
                                data: latencies,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                yAxisID: 'y',
                                tension: 0.3
                            },
                            {
                                label: 'Error Rate (%)',
                                data: errorRates,
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                yAxisID: 'y1',
                                tension: 0.3
                            },
                            {
                                label: 'Virtual Users',
                                data: users,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.05)',
                                yAxisID: 'y2',
                                borderDash: [5, 5],
                                tension: 0.1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Latency (ms)' }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'Error Rate (%)' },
                                grid: { drawOnChartArea: false }
                            },
                            y2: {
                                type: 'linear',
                                display: false
                            }
                        }
                    }
                });
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 pb-6 border-b border-gray-800">
                        <div>
                            <h1 className="text-4xl font-bold title-font text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-400">
                                LoadMind
                            </h1>
                            <p className="text-gray-400 text-sm mt-1">Autonomous Resilience Engineering Platform</p>
                        </div>
                        
                        {/* Learning dashboard stats */}
                        {learningStats && (
                            <div className="flex space-x-6 mt-4 md:mt-0">
                                <div className="glass-panel rounded-lg px-4 py-2 text-center">
                                    <div className="text-xs text-gray-400">Incidents Learned</div>
                                    <div className="text-xl font-bold text-indigo-400">{learningStats.total_incidents_stored}</div>
                                </div>
                                <div className="glass-panel rounded-lg px-4 py-2 text-center">
                                    <div className="text-xs text-gray-400">Remediation Success</div>
                                    <div className="text-xl font-bold text-green-400">{learningStats.remediation_success_rate}%</div>
                                </div>
                                <div className="glass-panel rounded-lg px-4 py-2 text-center">
                                    <div className="text-xs text-gray-400">Signatures Identified</div>
                                    <div className="text-xl font-bold text-purple-400">{learningStats.signatures_learned}</div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Main Workspace Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* Left: Test Control & Config */}
                        <div className="lg:col-span-1 space-y-6">
                            <div className="glass-panel rounded-xl p-6">
                                <h2 className="text-xl font-bold mb-4 title-font text-indigo-300">Target Configuration</h2>
                                <div className="mb-4">
                                    <label className="block text-sm text-gray-400 mb-2">Failure Scenario to Inject</label>
                                    <select 
                                        className="w-full bg-[#181a26] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500"
                                        value={failureMode}
                                        onChange={(e) => setFailureMode(e.target.value)}
                                        disabled={isTesting}
                                    >
                                        <option value="db_pool">Database Pool Exhaustion (pool_size=5)</option>
                                        <option value="n_plus_one">N+1 query problem on /products</option>
                                        <option value="unbounded_cache">Unbounded memory cache on /recommendations</option>
                                        <option value="missing_index">Missing database index on orders.user_id</option>
                                        <option value="blocking_async">Blocking synchronous call in async route</option>
                                        <option value="none">No Failure (Baseline Performance)</option>
                                    </select>
                                </div>

                                <button
                                    onClick={startTest}
                                    disabled={isTesting || isVerifying}
                                    className={`w-full py-3 rounded-lg font-semibold title-font transition-all ${
                                        isTesting 
                                        ? "bg-gray-700 cursor-not-allowed text-gray-400" 
                                        : "bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 shadow-lg text-white"
                                    }`}
                                >
                                    {isTesting ? "Executing Load Test..." : "Start Resilience Cycle"}
                                </button>
                            </div>

                            {/* Status Message */}
                            {statusMessage && (
                                <div className="glass-panel rounded-xl p-4 border border-blue-500/20 bg-blue-500/5">
                                    <div className="text-xs uppercase text-blue-400 font-bold mb-1">System Log</div>
                                    <div className="text-sm text-gray-300">{statusMessage}</div>
                                </div>
                            )}

                            {/* Incident History List */}
                            <div className="glass-panel rounded-xl p-6">
                                <h2 className="text-xl font-bold mb-4 title-font text-indigo-300">Incident History</h2>
                                <div className="space-y-3 max-h-60 overflow-y-auto">
                                    {incidents.map((inc) => (
                                        <div key={inc.id} className="p-3 bg-[#161a29] rounded-lg border border-gray-800 text-xs flex justify-between items-center">
                                            <div>
                                                <div className="font-semibold text-gray-200">Incident #{inc.id} - Mode: {inc.failure_mode}</div>
                                                <div className="text-gray-400 mt-1">
                                                    BP Concurrency: {inc.breaking_point_users || "N/A"} | P95: {inc.p95_ms ? `${Math.round(inc.p95_ms)}ms` : "N/A"}
                                                </div>
                                            </div>
                                            <span className={`px-2 py-0.5 rounded text-[10px] ${
                                                inc.success ? "bg-green-500/20 text-green-400" : "bg-red-500/20 text-red-400"
                                            }`}>
                                                {inc.success ? "Resolved" : "Failed"}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Right / Mid: Visualizer & Diagnostics */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {/* Live Metrics Graph */}
                            <div className="glass-panel rounded-xl p-6">
                                <h2 className="text-xl font-bold mb-4 title-font text-indigo-300">Live Test Execution</h2>
                                <div className="w-full h-64 bg-[#11131f] rounded-lg p-2">
                                    {testMetrics.length > 0 ? (
                                        <canvas ref={chartRef}></canvas>
                                    ) : (
                                        <div className="h-full flex items-center justify-center text-gray-500">
                                            No active run metrics. Start a test cycle to view live execution.
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Diagnosis & Remediation Panel */}
                            {diagnosis && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    
                                    {/* Diagnosis Card */}
                                    <div className="glass-panel rounded-xl p-6 border border-yellow-500/30">
                                        <div className="flex justify-between items-start mb-3">
                                            <h3 className="text-lg font-bold title-font text-yellow-400">Diagnosis</h3>
                                            <span className="bg-yellow-500/10 text-yellow-400 text-xs px-2 py-1 rounded font-mono">
                                                Confidence: {diagnosis.confidence * 100}%
                                            </span>
                                        </div>
                                        <div className="text-sm font-semibold text-gray-200">
                                            Root Cause: <span className="text-white underline">{diagnosis.primary_root_cause}</span>
                                        </div>
                                        <div className="mt-4">
                                            <div className="text-xs text-gray-400 uppercase font-bold mb-1">Evidence Summary:</div>
                                            <ul className="text-xs text-gray-300 space-y-1 list-disc pl-4">
                                                {diagnosis.evidence.map((ev, i) => (
                                                    <li key={i}>{ev}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>

                                    {/* Remediation Card */}
                                    {remediation && (
                                        <div className="glass-panel rounded-xl p-6 border border-green-500/30">
                                            <h3 className="text-lg font-bold title-font text-green-400 mb-3">Remediation Proposed</h3>
                                            <p className="text-xs text-gray-300 mb-3">{remediation.proposed_remediation}</p>
                                            
                                            {remediation.patch_diff && (
                                                <pre className="text-[10px] bg-black/40 p-2 rounded overflow-x-auto text-green-300 font-mono mb-4">
                                                    {remediation.patch_diff}
                                                </pre>
                                            )}

                                            {!remediation.is_applied ? (
                                                <button
                                                    onClick={applyRemediation}
                                                    className="w-full bg-green-600 hover:bg-green-500 text-white py-2 rounded font-semibold text-sm transition-all"
                                                >
                                                    Apply Code Fix
                                                </button>
                                            ) : (
                                                <div className="space-y-3">
                                                    <div className="text-xs text-green-400 font-semibold">✓ Patch Applied. Container restarted.</div>
                                                    {!verification && (
                                                        <button
                                                            onClick={verifyRemediation}
                                                            disabled={isVerifying}
                                                            className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded font-semibold text-sm transition-all"
                                                        >
                                                            {isVerifying ? "Verifying..." : "Verify Remediation"}
                                                        </button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Verification Result Card */}
                            {verification && (
                                <div className={`glass-panel rounded-xl p-6 border ${
                                    verification.success ? "border-green-500/50 bg-green-500/5" : "border-red-500/50 bg-red-500/5"
                                }`}>
                                    <h3 className="text-xl font-bold title-font mb-2">
                                        Verification Outcome: {verification.success ? "SUCCESS" : "FAILED"}
                                    </h3>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
                                        <div>
                                            <div className="text-xs text-gray-400">Latency Improvement</div>
                                            <div className="text-lg font-bold text-green-400">{verification.latency_improvement_percent}%</div>
                                        </div>
                                        <div>
                                            <div className="text-xs text-gray-400">Error Rate (Before → After)</div>
                                            <div className="text-lg font-bold text-gray-200">
                                                {(verification.error_rate_before * 100).toFixed(1)}% → {(verification.error_rate_after * 100).toFixed(1)}%
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-xs text-gray-400">Breaking Concurrency (Before)</div>
                                            <div className="text-lg font-bold text-gray-300">{verification.breaking_point_before} users</div>
                                        </div>
                                        <div>
                                            <div className="text-xs text-gray-400">Stable Concurrency (After)</div>
                                            <div className="text-lg font-bold text-blue-400">{verification.breaking_point_after} users</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
