<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadMind — Find Breaking Points Before Your Users Do</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0a0b0e;
            --sidebar-w: 220px;
            --right-col-w: 380px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            letter-spacing: -0.015em;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Ambient glowing background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 75% 20%, rgba(30, 38, 60, 0.45) 0%, transparent 50%),
                radial-gradient(circle at 10% 85%, rgba(18, 22, 34, 0.4) 0%, transparent 45%),
                #0a0b0e;
            z-index: -1;
            pointer-events: none;
        }

        /* 1:1 Precision Glass Cards matching reference image */
        .ui-card {
            background: #101217;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            position: relative;
        }

        .ui-card-subtle {
            background: #11131a;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
        }

        .nav-item-active {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border-radius: 10px;
        }

        /* Scenario Card Wave Graphic Bottom Overlay */
        .card-wave-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55px;
            background: radial-gradient(ellipse at 50% 120%, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.01) 60%, transparent 100%);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            pointer-events: none;
        }

        .card-wave-bg-active {
            background: radial-gradient(ellipse at 50% 120%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.03) 70%, transparent 100%);
        }

        /* 3D Glass Node Animation */
        .node-glow {
            filter: drop-shadow(0 0 45px rgba(120, 140, 255, 0.22));
            animation: floatNode 8s ease-in-out infinite alternate;
        }

        @keyframes floatNode {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen">
    <div class="ambient-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCENARIOS = [
            {
                id: "ecom",
                name: "E-Commerce Checkout Stress",
                subtitle: "Real checkout flow under sudden traffic spikes.",
                target: "http://localhost:8002/checkout/process",
                method: "GET",
                persona: "e_commerce_shopper",
                concurrency: 120,
                duration: 20,
                failure_mode: "blocking_async",
                icon: (
                    <svg className="w-5 h-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                )
            },
            {
                id: "db_heavy",
                name: "Database Heavy /products",
                subtitle: "Heavy read queries on product catalog.",
                target: "http://localhost:8002/products",
                method: "GET",
                persona: "heavy_read",
                concurrency: 80,
                duration: 20,
                failure_mode: "n_plus_one",
                icon: (
                    <svg className="w-5 h-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                    </svg>
                )
            },
            {
                id: "login_surge",
                name: "User Login Surge",
                subtitle: "Massive login attempts with rate limit pressure.",
                target: "http://localhost:8002/db-status",
                method: "GET",
                persona: "standard",
                concurrency: 100,
                duration: 20,
                failure_mode: "db_pool",
                icon: (
                    <svg className="w-5 h-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                )
            },
            {
                id: "spiky_burst",
                name: "Spiky Aggressive Burst",
                subtitle: "Short high intensity bursts to find breaking points.",
                target: "https://httpbin.org/get",
                method: "GET",
                persona: "aggressive_burst",
                concurrency: 60,
                duration: 15,
                failure_mode: "none",
                icon: (
                    <svg className="w-5 h-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                )
            }
        ];

        function App() {
            const [selectedScenario, setSelectedScenario] = useState(SCENARIOS[0]);
            const [targetUrl, setTargetUrl] = useState("http://target-app:8002");
            const [isTesting, setIsTesting] = useState(false);
            const [isVerifying, setIsVerifying] = useState(false);
            const [testTimer, setTestTimer] = useState("00:07:42");
            const [activeNav, setActiveNav] = useState("home");
            const [codeTab, setCodeTab] = useState("diff");

            // Dynamic Live Telemetry State
            const [metrics, setMetrics] = useState([]);
            const [diagnosis, setDiagnosis] = useState(null);
            const [remediation, setRemediation] = useState(null);
            const [verification, setVerification] = useState(null);
            const [learningStats, setLearningStats] = useState(null);
            const [incidents, setIncidents] = useState([]);
            const [currentTest, setCurrentTest] = useState(null);

            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const pollingTimer = useRef(null);
            const timerInterval = useRef(null);

            useEffect(() => {
                fetchInitialData();
                return () => {
                    if (pollingTimer.current) clearInterval(pollingTimer.current);
                    if (timerInterval.current) clearInterval(timerInterval.current);
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, []);

            // Dynamically redraw waveform chart when metrics stream arrives
            useEffect(() => {
                if (chartRef.current) {
                    renderWaveform();
                }
            }, [metrics]);

            const fetchInitialData = async () => {
                try {
                    const [learnRes, incRes] = await Promise.all([
                        fetch("http://localhost:8001/api/learning"),
                        fetch("http://localhost:8001/api/incidents")
                    ]);
                    if (learnRes.ok) setLearningStats(await learnRes.json());
                    if (incRes.ok) setIncidents(await incRes.json());
                } catch (e) {}
            };

            const runQuickTest = async () => {
                setIsTesting(true);
                setDiagnosis(null);
                setRemediation(null);
                setVerification(null);
                setMetrics([]);

                let secs = 0;
                if (timerInterval.current) clearInterval(timerInterval.current);
                timerInterval.current = setInterval(() => {
                    secs++;
                    const h = String(Math.floor(secs / 3600)).padStart(2, '0');
                    const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
                    const s = String(secs % 60).padStart(2, '0');
                    setTestTimer(`${h}:${m}:${s}`);
                }, 1000);

                try {
                    const payload = {
                        name: selectedScenario.name,
                        target_app_url: targetUrl.includes("http") ? targetUrl : `http://${targetUrl}`,
                        http_method: selectedScenario.method,
                        user_persona: selectedScenario.persona,
                        load_profile: "step_ramp",
                        max_concurrency: selectedScenario.concurrency,
                        duration_seconds: selectedScenario.duration,
                        failure_mode: selectedScenario.failure_mode
                    };

                    const res = await fetch("http://localhost:8001/api/tests/start", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const test = await res.json();
                        setCurrentTest(test);
                        pollTest(test.id);
                    } else {
                        setIsTesting(false);
                        if (timerInterval.current) clearInterval(timerInterval.current);
                    }
                } catch (e) {
                    setIsTesting(false);
                    if (timerInterval.current) clearInterval(timerInterval.current);
                }
            };

            const pollTest = (id) => {
                if (pollingTimer.current) clearInterval(pollingTimer.current);
                pollingTimer.current = setInterval(async () => {
                    try {
                        const [tRes, mRes] = await Promise.all([
                            fetch(`http://localhost:8001/api/tests/${id}`),
                            fetch(`http://localhost:8001/api/tests/${id}/metrics`)
                        ]);

                        if (tRes.ok) {
                            const t = await tRes.json();
                            setCurrentTest(t);
                            if (mRes.ok) {
                                const m = await mRes.json();
                                setMetrics(m);
                            }
                            if (t.status === "completed") {
                                clearInterval(pollingTimer.current);
                                clearInterval(timerInterval.current);
                                setIsTesting(false);
                                fetchAIResults(id);
                                fetchInitialData();
                            }
                        }
                    } catch (e) {}
                }, 1000);
            };

            const fetchAIResults = async (id) => {
                try {
                    const [dRes, rRes] = await Promise.all([
                        fetch(`http://localhost:8001/api/tests/${id}/diagnosis`),
                        fetch(`http://localhost:8001/api/tests/${id}/remediation`)
                    ]);
                    if (dRes.ok) setDiagnosis(await dRes.json());
                    if (rRes.ok) setRemediation(await rRes.json());
                } catch (e) {}
            };

            const applyPatch = async () => {
                if (!currentTest) return;
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/remediate`, { method: "POST" });
                    if (res.ok) {
                        const data = await res.json();
                        setRemediation(data.remediation);
                    }
                } catch (e) {}
            };

            const verifyPostFix = async () => {
                if (!currentTest) return;
                setIsVerifying(true);
                try {
                    const res = await fetch(`http://localhost:8001/api/tests/${currentTest.id}/verify`, { method: "POST" });
                    if (res.ok) {
                        const data = await res.json();
                        setVerification(data);
                        fetchInitialData();
                    }
                    setIsVerifying(false);
                } catch (e) {
                    setIsVerifying(false);
                }
            };

            const renderWaveform = () => {
                const ctx = chartRef.current.getContext('2d');
                const labels = metrics.length > 0 ? metrics.map((m, i) => m.timestamp || `${i}s`) : ['00:00', '01:00', '02:00', '03:00', '04:00', '05:00', '06:00', '07:00', '08:00', '09:00', '10:00'];
                const p50s = metrics.length > 0 ? metrics.map(m => m.p50_ms || 160) : [140, 155, 162, 170, 165, 180, 162, 175, 160, 165, 170];
                const p95s = metrics.length > 0 ? metrics.map(m => m.p95_ms || 812) : [620, 710, 780, 812, 790, 890, 812, 860, 800, 820, 812];
                const p99s = metrics.length > 0 ? metrics.map(m => m.p99_ms || 1024) : [800, 920, 990, 1024, 980, 1100, 1024, 1080, 1010, 1040, 1024];
                const rpss = metrics.length > 0 ? metrics.map(m => m.rps || 412) : [310, 380, 412, 430, 412, 450, 412, 440, 410, 425, 412];

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const gradArea = ctx.createLinearGradient(0, 0, 0, 220);
                gradArea.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
                gradArea.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'P95 Latency',
                                data: p95s,
                                borderColor: '#ffffff',
                                backgroundColor: gradArea,
                                fill: true,
                                borderWidth: 1.8,
                                pointRadius: metrics.length > 0 ? 2 : 0,
                                pointBackgroundColor: '#ffffff',
                                tension: 0.4,
                                yAxisID: 'y'
                            },
                            {
                                label: 'P99 Latency',
                                data: p99s,
                                borderColor: 'rgba(255, 255, 255, 0.45)',
                                backgroundColor: 'transparent',
                                borderWidth: 1.2,
                                borderDash: [3, 3],
                                pointRadius: 0,
                                tension: 0.4,
                                yAxisID: 'y'
                            },
                            {
                                label: 'P50 Latency',
                                data: p50s,
                                borderColor: 'rgba(255, 255, 255, 0.25)',
                                backgroundColor: 'transparent',
                                borderWidth: 1.5,
                                pointRadius: 0,
                                tension: 0.4,
                                yAxisID: 'y'
                            },
                            {
                                label: 'RPS Throughput',
                                data: rpss,
                                borderColor: 'rgba(99, 102, 241, 0.6)',
                                backgroundColor: 'transparent',
                                borderWidth: 1.5,
                                pointRadius: 0,
                                tension: 0.4,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#121520',
                                borderColor: 'rgba(255, 255, 255, 0.15)',
                                borderWidth: 1,
                                titleColor: '#ffffff',
                                bodyColor: '#cbd5e1',
                                padding: 8,
                                cornerRadius: 6
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.03)' },
                                ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 9 } }
                            },
                            y: {
                                type: 'linear',
                                position: 'left',
                                grid: { color: 'rgba(255, 255, 255, 0.03)' },
                                ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 9 } }
                            },
                            y1: {
                                type: 'linear',
                                position: 'right',
                                grid: { drawOnChartArea: false },
                                ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 9 } }
                            }
                        }
                    }
                });
            };

            const latestMetric = metrics.length > 0 ? metrics[metrics.length - 1] : null;

            return (
                <div className="flex min-h-screen w-full bg-[#0a0b0e] text-slate-100 selection:bg-indigo-500 selection:text-white">
                    
                    {/* 1. LEFT SIDEBAR */}
                    <aside className="w-[210px] shrink-0 border-r border-white/[0.06] flex flex-col justify-between p-5 bg-[#0b0c10]/95 backdrop-blur-xl fixed top-0 bottom-0 left-0 z-30">
                        <div className="space-y-7">
                            {/* Brand Header */}
                            <div className="flex items-center space-x-3 px-1 pt-1">
                                <svg className="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                                </svg>
                                <div>
                                    <div className="text-base font-bold tracking-tight text-white leading-none">LoadMind</div>
                                    <div className="text-[9px] text-slate-500 tracking-wider font-semibold uppercase mt-1">STRESS • DIAGNOSE • EVOLVE</div>
                                </div>
                            </div>

                            {/* Nav Menu */}
                            <nav className="space-y-1">
                                {[
                                    { id: "home", label: "Home", icon: (
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                                        </svg>
                                    )},
                                    { id: "scenarios", label: "Scenarios", icon: (
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                                        </svg>
                                    )},
                                    { id: "memory", label: "AI Memory", icon: (
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                                        </svg>
                                    )},
                                    { id: "reports", label: "Reports", icon: (
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                        </svg>
                                    )},
                                    { id: "settings", label: "Settings", icon: (
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        </svg>
                                    )},
                                ].map((item) => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveNav(item.id)}
                                        className={`w-full flex items-center space-x-3 px-3 py-2 text-xs font-medium transition ${
                                            activeNav === item.id 
                                                ? 'nav-item-active text-white' 
                                                : 'text-slate-400 hover:text-white hover:bg-white/[0.03]'
                                        }`}
                                    >
                                        <span className="text-slate-400">{item.icon}</span>
                                        <span>{item.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* Bottom Tagline & Version */}
                        <div className="px-1 space-y-2 border-t border-white/[0.05] pt-4">
                            <div className="text-[11px] text-slate-500 font-medium leading-tight">
                                <div>Better</div>
                                <div>Systems</div>
                                <div>Every Run</div>
                            </div>
                            <div className="text-[10px] text-slate-600 font-mono pt-1">v1.0.0</div>
                        </div>
                    </aside>

                    {/* MAIN SCROLLABLE VIEWPORT */}
                    <div className="pl-[210px] flex-1 flex flex-col min-h-screen">
                        
                        {/* 2. TOP NAVBAR */}
                        <header className="h-16 border-b border-white/[0.05] px-8 flex items-center justify-between bg-[#0a0b0e]/80 backdrop-blur-md sticky top-0 z-20">
                            {/* Target Connected Pill */}
                            <div className="flex items-center space-x-2.5 bg-[#12141a] border border-white/[0.08] rounded-full pl-3 pr-4 py-1.5 shadow-inner">
                                <span className={`w-2 h-2 rounded-full ${isTesting ? 'bg-amber-400 animate-ping' : 'bg-emerald-400'}`}></span>
                                <span className="text-xs text-slate-400 font-medium">Target Connected</span>
                                <input 
                                    type="text" 
                                    value={targetUrl}
                                    onChange={(e) => setTargetUrl(e.target.value)}
                                    disabled={isTesting}
                                    className="bg-transparent text-xs text-white font-mono outline-none border-none w-48 md:w-64"
                                />
                                <span className="text-xs text-slate-500">→</span>
                            </div>

                            {/* Header Actions */}
                            <div className="flex items-center space-x-4">
                                <button className="text-slate-400 hover:text-white transition p-1.5">
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                                    </svg>
                                </button>
